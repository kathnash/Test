<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Resonate — ambient album art</title>
<style>
  :root{
    --ui: rgba(255,255,255,.92);
    --dim: rgba(255,255,255,.45);
    --line: rgba(255,255,255,.14);
    --panel: rgba(12,12,16,.72);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; background:#000; overflow:hidden; }
  body{
    font: 400 15px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    color: var(--ui); overscroll-behavior:none; touch-action:manipulation;
  }
  canvas#c, canvas#fxc{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  canvas#fxc{ display:none; }
  body.fx canvas#c{ display:none; }
  body.fx canvas#fxc{ display:block; }

  #gate{
    position:fixed; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:24px; padding:32px 24px; text-align:center;
    background: radial-gradient(120% 90% at 50% 12%, #171726 0%, #06060a 55%, #000 100%);
    transition: opacity .55s ease, visibility .55s;
  }
  #gate.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .mark{
    width:64px; height:64px; border-radius:18px;
    background: conic-gradient(from 20deg, #6ee7ff, #a78bfa, #fb7185, #fbbf24, #6ee7ff);
    animation: spin 11s linear infinite; box-shadow:0 0 60px rgba(139,124,246,.4);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  h1{ font-size:26px; font-weight:600; letter-spacing:-.02em; margin:0; }
  .sub{ color:var(--dim); max-width:36ch; margin:-12px 0 0; font-size:14.5px; }
  .choices{ display:flex; flex-direction:column; gap:10px; width:min(360px,100%); }
  button.src{
    appearance:none; cursor:pointer; text-align:left; display:flex; align-items:center; gap:14px;
    padding:14px 16px; border-radius:14px; border:1px solid var(--line);
    background:rgba(255,255,255,.045); color:var(--ui); font:inherit;
    transition: background .18s, border-color .18s, transform .12s;
  }
  button.src:hover{ background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.3); }
  button.src:active{ transform:scale(.985); }
  button.src[disabled]{ opacity:.34; cursor:not-allowed; }
  .ico{ font-size:20px; width:24px; text-align:center; flex:none; }
  .txt b{ display:block; font-weight:550; font-size:15px; }
  .txt span{ display:block; color:var(--dim); font-size:12.5px; line-height:1.4; margin-top:2px; }
  #err{ color:#fda4af; font-size:13px; min-height:1em; max-width:40ch; margin:0; }
  .note{ color:rgba(255,255,255,.3); font-size:12px; max-width:40ch; margin:0; }

  /* now-playing card */
  #np{
    position:fixed; z-index:15; left:0; right:0; bottom:74px;
    display:flex; align-items:center; gap:15px; justify-content:center;
    opacity:0; transform:translateY(8px); transition:opacity .8s ease, transform .8s ease;
    pointer-events:none; padding:0 20px;
  }
  #np.show{ opacity:1; transform:none; }
  #np img{
    width:62px; height:62px; border-radius:10px; object-fit:cover; flex:none;
    box-shadow:0 12px 40px rgba(0,0,0,.6); background:#222;
  }
  #np .meta{ text-align:left; min-width:0; }
  #np .t{ font-size:16px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #np .a{ font-size:13.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #hud{
    position:fixed; z-index:20; left:14px; right:14px; bottom:14px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    opacity:0; transition:opacity .45s ease; pointer-events:none;
  }
  #hud.show{ opacity:1; pointer-events:auto; }
  .chip{
    appearance:none; cursor:pointer; padding:9px 14px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    color:var(--ui); font:inherit; font-size:13px; transition:background .16s;
  }
  .chip:hover{ background:rgba(40,40,52,.85); }
  .spacer{ flex:1 1 auto; }
  #swatches{ display:flex; gap:4px; align-items:center; }
  #swatches i{ width:15px; height:15px; border-radius:4px; display:block; box-shadow:0 0 0 1px rgba(255,255,255,.15) inset; }

  #lookmenu{
    position:fixed; z-index:22; left:14px; bottom:60px;
    display:none; flex-direction:column; gap:2px; padding:6px;
    border-radius:14px; border:1px solid var(--line); background:var(--panel);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    max-height:60vh; overflow-y:auto;
  }
  #lookmenu.on{ display:flex; }
  #lookmenu button{
    appearance:none; cursor:pointer; text-align:left; white-space:nowrap;
    padding:9px 16px; border-radius:9px; border:0; background:transparent;
    color:var(--ui); font:inherit; font-size:13.5px;
  }
  #lookmenu button:hover{ background:rgba(255,255,255,.10); }
  #lookmenu button[aria-current="true"]{ background:rgba(255,255,255,.9); color:#0a0a0d; }

  #drop{
    position:fixed; inset:0; z-index:40; display:none;
    align-items:center; justify-content:center;
    background:rgba(5,5,10,.86); backdrop-filter:blur(8px);
    font-size:19px; letter-spacing:-.01em;
  }
  #drop.on{ display:flex; }
  #drop div{ border:2px dashed rgba(255,255,255,.4); border-radius:20px; padding:44px 60px; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<canvas id="fxc"></canvas>

<div id="np"><img id="np-art" alt=""><div class="meta"><div class="t" id="np-t"></div><div class="a" id="np-a"></div></div></div>

<div id="gate">
  <div class="mark"></div>
  <h1>Ambient album art</h1>
  <p class="sub">Artwork dissolved into drifting colour fields that breathe with the music. Pick where the sound comes from.</p>
  <div class="choices">
    <button class="src" id="btn-mic"><span class="ico">🎙️</span><span class="txt"><b>Microphone</b><span>Play music out loud from anything. Works on phone and desktop.</span></span></button>
    <button class="src" id="btn-tab"><span class="ico">🖥️</span><span class="txt"><b>This device's audio</b><span>Desktop Chrome or Edge. Tick “share audio” in the picker.</span></span></button>
    <button class="src" id="btn-demo"><span class="ico">✳️</span><span class="txt"><b>Demo tone</b><span>No permissions needed.</span></span></button>
  </div>
  <p id="err"></p>
  <p class="note">Drop an image or a video on the page at any time to use it as the source.</p>
</div>

<div id="hud">
  <button class="chip" id="art">Artwork…</button>
  <button class="chip" id="look">Poster</button>
  <button class="chip" id="sens">Sensitivity: mid</button>
  <button class="chip" id="full">Fullscreen</button>
  <span class="spacer"></span>
  <span id="swatches"></span>
  <button class="chip" id="restart">Change source</button>
</div>

<div id="lookmenu"></div>
<div id="drop"><div>Drop artwork to use it</div></div>
<input type="file" id="file" accept="image/*,video/*" hidden>

<script src="audio.js"></script>
<script src="fx.js"></script>
<script>
"use strict";

/* =====================================================================
   ARTWORK  —  palette extraction
   ===================================================================== */
const ART = {
  img: null, palette: [], raw: [], dark: '#07070b', ready: false,
  title: '', artist: '', isVideo: false
};

/* Colours sampled off a cover are usually far too dark to work as light —
   averaging a gradient-heavy image pulls everything toward the background.
   Push each one into a vivid band so the blobs actually glow, while keeping
   its hue, which is what makes the result still feel like the album. */
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r)      h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
    else if (mx === g) h = ((b - r) / d + 2) / 6;
    else               h = ((r - g) / d + 4) / 6;
  }
  const l = (mx + mn) / 2;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  return [h, s, l];
}
function hslToRgb(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h * 6) % 2 - 1));
  const m = l - c / 2;
  const t = h * 6;
  let r = 0, g = 0, b = 0;
  if (t < 1)      [r, g, b] = [c, x, 0];
  else if (t < 2) [r, g, b] = [x, c, 0];
  else if (t < 3) [r, g, b] = [0, c, x];
  else if (t < 4) [r, g, b] = [0, x, c];
  else if (t < 5) [r, g, b] = [x, 0, c];
  else            [r, g, b] = [c, 0, x];
  return [(r + m) * 255 | 0, (g + m) * 255 | 0, (b + m) * 255 | 0];
}
function vivify([r, g, b]) {
  let [h, s, l] = rgbToHsl(r, g, b);
  // A near-neutral has no meaningful hue — whatever tiny channel imbalance
  // it has is noise, and saturating it invents a colour that was never on
  // the cover. Greys stay grey; only lightness is normalised.
  if (s < 0.12) return hslToRgb(h, s, 0.42 + l * 0.26);
  s = Math.min(1, Math.max(s, 0.5) * 1.2);
  l = 0.44 + l * 0.26;              // compress into 0.44 – 0.70
  return hslToRgb(h, s, l);
}

// Median-cut is overkill here. Quantise into coarse buckets, take the most
// populous, then greedily reject anything too close to a colour already
// chosen — that rejection step is what stops a photo returning five
// near-identical browns.
function extractPalette(img, count = 5) {
  const S = 56;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const x = cv.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, S, S);   // works for <img> and <video> alike

  let data;
  try {
    data = x.getImageData(0, 0, S, S).data;
  } catch (e) {
    // Tainted canvas: a cross-origin image without CORS headers.
    throw new Error('TAINTED');
  }

  const buckets = new Map();
  let rs = 0, gs = 0, bs = 0, n = 0;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 128) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    rs += r; gs += g; bs += b; n++;
    const key = (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4);
    const e = buckets.get(key);
    if (e) { e.r += r; e.g += g; e.b += b; e.n++; }
    else buckets.set(key, { r, g, b, n: 1 });
  }
  if (!n) throw new Error('EMPTY');

  const all = [...buckets.values()]
    .map(e => ({ r: e.r / e.n, g: e.g / e.n, b: e.b / e.n, n: e.n }))
    // Weight by colourfulness so a dominant grey background doesn't win
    // every slot on an otherwise vivid cover.
    .map(c => {
      const mx = Math.max(c.r, c.g, c.b), mn = Math.min(c.r, c.g, c.b);
      const sat = mx === 0 ? 0 : (mx - mn) / mx;
      return { ...c, score: c.n * (0.35 + sat * 1.5) };
    })
    .sort((a, b) => b.score - a.score);

  const picked = [];
  const dist2 = (a, b) => (a.r-b.r)**2 + (a.g-b.g)**2 + (a.b-b.b)**2;
  for (const c of all) {
    if (picked.length >= count) break;
    if (picked.every(p => dist2(p, c) > 2100)) picked.push(c);
  }
  // Relax the spacing rule if the cover genuinely is near-monochrome.
  for (const c of all) { if (picked.length >= count) break; if (!picked.includes(c)) picked.push(c); }

  const avg = { r: rs / n, g: gs / n, b: bs / n };
  return {
    palette: picked.slice(0, count).map(c => [c.r | 0, c.g | 0, c.b | 0]),
    dark: `rgb(${avg.r * 0.34 | 0},${avg.g * 0.33 | 0},${avg.b * 0.38 | 0})`
  };
}

// A <video> reports its size as videoWidth/videoHeight; an <img> as
// width/height. Everything downstream goes through these.
const srcW = m => m ? (m.videoWidth || m.width || 0) : 0;
const srcH = m => m ? (m.videoHeight || m.height || 0) : 0;

function applyArtwork(img, title = '', artist = '', isVideo = false) {
  const { palette, dark } = extractPalette(img);
  ART.img = img;
  ART.raw = palette;                    // true album colours, shown as swatches
  ART.palette = palette.map(vivify);    // brightened, used to paint
  ART.dark = dark;
  ART.title = title; ART.artist = artist; ART.ready = true;
  ART.isVideo = isVideo;
  renderTiny();
  buildPoster();
  seedBlobs();
  paintSwatches();
  FX.setSource(ART.img, srcW(ART.img), srcH(ART.img));

  const np = document.getElementById('np');
  if (title || artist) {
    const thumb = document.getElementById('np-art');
    if (isVideo) thumb.removeAttribute('src'); else thumb.src = img.src;
    document.getElementById('np-t').textContent = title;
    document.getElementById('np-a').textContent = artist;
    np.classList.add('show');
    clearTimeout(applyArtwork._t);
    applyArtwork._t = setTimeout(() => np.classList.remove('show'), 8000);
  } else np.classList.remove('show');
}

function loadImage(src, crossOrigin) {
  return new Promise((res, rej) => {
    const im = new Image();
    if (crossOrigin) im.crossOrigin = 'anonymous';
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('LOAD_FAILED'));
    im.src = src;
  });
}

/* A stand-in cover so the page does something on first open. */
function sampleArtwork() {
  const s = 600, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const x = cv.getContext('2d');
  const bg = x.createLinearGradient(0, 0, s, s);
  bg.addColorStop(0, '#1b1035'); bg.addColorStop(1, '#3d1220');
  x.fillStyle = bg; x.fillRect(0, 0, s, s);
  const blobs = [
    ['#ff5c7a', .30, .32, .30], ['#ffd166', .70, .28, .22],
    ['#5ce1e6', .34, .72, .26], ['#8b5cf6', .74, .70, .28]
  ];
  for (const [col, cx, cy, r] of blobs) {
    const gr = x.createRadialGradient(cx*s, cy*s, 0, cx*s, cy*s, r*s);
    gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr; x.fillRect(0, 0, s, s);
  }
  x.globalCompositeOperation = 'overlay';
  x.fillStyle = '#fff';
  x.beginPath(); x.arc(s*.5, s*.52, s*.19, 0, Math.PI*2); x.fill();
  return loadImage(cv.toDataURL());
}

/* =====================================================================
   RENDER
   The whole scene is drawn into a tiny offscreen buffer and then scaled
   up to the display with smoothing. That upscale IS the abstraction — it
   melts the artwork into soft gradient fields for free, and costs a
   fraction of a real blur filter.
   ===================================================================== */
const cv = document.getElementById('c');
const g  = cv.getContext('2d', { alpha: false });
const LO = document.createElement('canvas');
const lg = LO.getContext('2d');

/* The artwork is first crushed to a handful of pixels, and that is what
   gets painted underneath. Drawing the cover itself — even small and
   blurred — just looks like a blurred cover; at this size only the broad
   composition and colour placement survive, which is the part worth
   keeping. TINY_W sets how abstract the result is. */
const TINY = document.createElement('canvas');
const tg = TINY.getContext('2d');
const TINY_W = 7;

let W = 0, H = 0, DPR = 1, LOW = 132;
let VIGNETTE = null, GRAIN_SHEET = null;

function renderTiny() {
  if (!ART.img || !srcW(ART.img)) return;
  const ar = LO.height / Math.max(1, LO.width);
  TINY.width = TINY_W;
  TINY.height = Math.max(3, Math.round(TINY_W * ar));
  const s = Math.max(TINY.width / srcW(ART.img), TINY.height / srcH(ART.img));
  const dw = srcW(ART.img) * s, dh = srcH(ART.img) * s;
  tg.clearRect(0, 0, TINY.width, TINY.height);
  tg.drawImage(ART.img, (TINY.width - dw) / 2, (TINY.height - dh) / 2, dw, dh);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  const ar = H / W;
  LO.width = LOW; LO.height = Math.max(8, Math.round(LOW * ar));
  PREV.width = LO.width; PREV.height = LO.height;

  VIGNETTE = g.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.3,
                                    W/2, H/2, Math.max(W,H) * 0.78);
  VIGNETTE.addColorStop(0, 'rgba(0,0,0,0)');
  VIGNETTE.addColorStop(1, 'rgba(0,0,0,1)');

  GRAIN_SHEET = document.createElement('canvas');
  GRAIN_SHEET.width = Math.max(1, Math.round(W));
  GRAIN_SHEET.height = Math.max(1, Math.round(H));
  const gsx = GRAIN_SHEET.getContext('2d');
  for (let y = 0; y < GRAIN_SHEET.height; y += 128)
    for (let x = 0; x < GRAIN_SHEET.width; x += 128) gsx.drawImage(GRAIN, x, y);

  FX.resize(W, H);
  renderTiny();
  buildPoster();
  seedBlobs();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));

/* Looks that differ in kind, not in degree. Drift is calm and ambient;
   Poster quantises the artwork into flat hard-edged blocks; Swirl feeds the
   previous frame back through a rotation to build a vortex; Glitch tears the
   image into slices and splits the colour channels.
   Referenced by name, never by index, so the order can change freely. */
const LOOKS = [
  // hidden:true keeps a look fully implemented but out of the picker, so
  // it can be brought back by deleting one word.
  { name:'Drift',  move:0.85, kick:0.70, rad:0.85, alpha:0.55, comp:'source-over', hidden:true },
  { name:'Poster', move:0.50, kick:1.00, rad:1.00, alpha:0.60, comp:'source-over' },
  { name:'Swirl',  move:1.00, kick:0.95, rad:1.00, alpha:0.60, comp:'source-over' },
  { name:'Glitch', move:1.40, kick:1.50, rad:1.15, alpha:0.72, comp:'lighter', hidden:true },
  // Shader looks: the artwork is bent rather than painted over.
  { name:'Ripple', fx:'Ripple' },
  { name:'Ribbed', fx:'Ribbed' },
  { name:'Marble', fx:'Marble', hidden:true },
  { name:'Lens',   fx:'Lens'   }
];
let look = LOOKS.findIndex(l => !l.hidden);
let time = 0;
const is = name => LOOKS[look].name === name;

// Sensitivity is a user control because the right value depends entirely on
// how loud the room is and how far away the phone is — no fixed default is
// correct for both a kitchen speaker and a club.
const SENS = [1, 1.9, 3.2];
const SENS_NAME = ['Sensitivity: low', 'Sensitivity: mid', 'Sensitivity: high'];
let sens = 1;
const gain = () => SENS[sens];

/* Soft knee rather than min(1, v * gain). A hard clamp pins every value at
   maximum as soon as gain is raised, which flattens the dynamics and makes
   HIGHER sensitivity look LESS alive — the opposite of the control's job.
   This curve approaches 1 without ever reaching it, so quiet material gets
   lifted while loud material still has somewhere left to go. */
const resp = v => 1 - Math.exp(-v * gain() * 1.8);

let blobs = [];
function seedBlobs() {
  const n = 9;
  blobs = [];
  const GOLD = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    blobs.push({
      ci: i % Math.max(1, ART.palette.length),
      // Golden-angle seeding spreads the starting points evenly instead of
      // letting Math.random() clump them.
      px: 0.5 + Math.cos(i * GOLD) * (0.14 + (i % 3) * 0.13),
      py: 0.5 + Math.sin(i * GOLD) * (0.14 + (i % 3) * 0.13),
      sx: 0.11 + Math.random() * 0.20,
      sy: 0.10 + Math.random() * 0.20,
      ph: Math.random() * 6.28,
      r:  0.17 + Math.random() * 0.19,
      band: i % 5,
      e: 0, ox: 0, oy: 0, vx: 0, vy: 0, orb: 0
    });
  }
}

const bandVal = i => [A.bass, A.mid, A.high, A.air, A.level][i] || 0;

/* Shared by Ripple (expanding rings) and Marble (ink pushing the pattern
   outward). Four at a time is all the shader carries. */
let drops = [];
function updateDrops(dt) {
  for (const d of drops) d.age += dt;
  drops = drops.filter(d => d.age < 6);
  if (A.beatFlash > 0.9) {
    drops.push({ x: 0.15 + Math.random() * 1.2, y: Math.random(), age: 0 });
    if (drops.length > 4) drops.shift();
  }
}

/* The fix for "it barely moves": audio drives the rate of motion and kicks
   the blobs around, instead of only scaling a shape that a fixed clock was
   moving anyway. */
function updateBlobs(dt) {
  const cfg = LOOKS[look], G = gain();
  for (const b of blobs) {
    const target = resp(bandVal(b.band));
    b.e += (target - b.e) * (target > b.e ? 0.45 : 0.12);

    // Rate is deliberately almost independent of sustained loudness. Music
    // is loud continuously, so tying speed to level yields constant fast
    // motion that reads as unrelated to the sound. Transients do the moving.
    b.ph  += dt * (0.030 + b.e * 0.26) * cfg.move;
    b.orb += dt * (0.018 + b.e * 0.14) * cfg.move;

    if (A.beatFlash > 0.9) {
      const ang = Math.random() * Math.PI * 2;
      const p = (0.12 + b.e * 0.42) * G * cfg.kick;
      b.vx += Math.cos(ang) * p;
      b.vy += Math.sin(ang) * p;
    }
    b.vx *= 0.93; b.vy *= 0.93;
    b.ox = (b.ox + b.vx * dt) * 0.985;   // decay back toward home
    b.oy = (b.oy + b.vy * dt) * 0.985;
  }
}

/* Swirl feeds the last frame back in, rotated and slightly enlarged. Each
   frame's colour therefore spirals outward for several seconds, which is
   what reads as a vortex rather than as moving circles. */
const PREV = document.createElement('canvas');
const pg = PREV.getContext('2d');
let swirlAngle = 0;

/* Isolates one colour channel of the low-res buffer, for Glitch's chromatic
   split. Reassigning width both resizes and clears it. */
const CH = document.createElement('canvas');
const cg = CH.getContext('2d');
function channel(colour) {
  if (CH.width !== LO.width || CH.height !== LO.height) {
    CH.width = LO.width; CH.height = LO.height;
  }
  cg.globalCompositeOperation = 'copy';   // clears and draws in one pass
  cg.drawImage(LO, 0, 0);
  cg.globalCompositeOperation = 'multiply';
  cg.fillStyle = colour;
  cg.fillRect(0, 0, CH.width, CH.height);
  return CH;
}

/* Poster is the graphic counterpart to the soft looks. The artwork is read
   at a coarse grid, each cell snapped to its nearest extracted colour, and
   drawn as flat rectangles with no smoothing — so it stays unmistakably the
   album while reading as hard-edged colour blocks rather than a blur. */
const POSTER = { cols: 0, rows: 0, cell: null, rgb: null };
// 0 = pure palette, 1 = the picture untouched. Partway keeps the flat
// poster feel while letting the image read.
const POSTER_IMAGE = 0.62;

function buildPoster() {
  if (!ART.img || !srcW(ART.img) || !ART.palette.length) return;
  const cols = 24;   // finer grid reads more of the picture
  const rows = Math.max(3, Math.round(cols * (H || 1) / (W || 1)));
  const c = document.createElement('canvas');
  c.width = cols; c.height = rows;
  const x = c.getContext('2d', { willReadFrequently: true });
  const s = Math.max(cols / srcW(ART.img), rows / srcH(ART.img));
  const dw = srcW(ART.img) * s, dh = srcH(ART.img) * s;
  try {
    x.drawImage(ART.img, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
    const d = x.getImageData(0, 0, cols, rows).data;
    const cell = new Uint8Array(cols * rows);
    // Keep each cell's true colour as well as its palette index, so the
    // blocks can be blended back toward the actual picture instead of being
    // limited to five flat tones.
    const rgb = new Uint8Array(cols * rows * 3);
    for (let i = 0; i < cols * rows; i++) {
      const r = d[i*4], g2 = d[i*4+1], b = d[i*4+2];
      rgb[i*3] = r; rgb[i*3+1] = g2; rgb[i*3+2] = b;
      let best = 0, bd = Infinity;
      for (let p = 0; p < ART.palette.length; p++) {
        const [pr, pg, pb] = ART.palette[p];
        const dist = (pr-r)**2 + (pg-g2)**2 + (pb-b)**2;
        if (dist < bd) { bd = dist; best = p; }
      }
      cell[i] = best;
    }
    POSTER.cols = cols; POSTER.rows = rows; POSTER.cell = cell; POSTER.rgb = rgb;
  } catch (e) { POSTER.cell = null; }   // tainted source
}

function drawPoster(dt) {
  if (!POSTER.cell) { g.fillStyle = ART.dark; g.fillRect(0, 0, W, H); return; }
  const { cols, rows, cell } = POSTER;
  const cw = W / cols, ch = H / rows;
  g.fillStyle = ART.dark;
  g.fillRect(0, 0, W, H);
  g.imageSmoothingEnabled = false;

  for (let r = 0; r < rows; r++) {
    // Each row is displaced by one frequency band, so the picture shears
    // apart along the music instead of every block moving together.
    const e = resp(bandVal(r % 5));
    const shove = (r % 2 ? 1 : -1) * (e * 0.20 + A.beat * 0.45) * cw * 2.4;
    // Overscan by two cells each side. A shoved row would otherwise pull away
    // from the screen edge and expose the ground colour — the same gap that
    // made Swirl look like it was punched through to the background.
    for (let c = -2; c <= cols + 1; c++) {
      const src = c < 0 ? 0 : c > cols - 1 ? cols - 1 : c;
      const idx = r * cols + src;
      const shift = (A.beat > 0.55 && (r + c) % 3 === 0) ? 1 : 0;
      const pal = ART.palette[(cell[idx] + shift) % ART.palette.length];
      const k = POSTER_IMAGE;
      const pr = pal[0] + (POSTER.rgb[idx*3]     - pal[0]) * k;
      const pg = pal[1] + (POSTER.rgb[idx*3 + 1] - pal[1]) * k;
      const pb = pal[2] + (POSTER.rgb[idx*3 + 2] - pal[2]) * k;
      // Blocks grow toward their neighbours on transients and open up gaps
      // of the ground colour when the music is quiet.
      const grow = 1 + e * 0.28 + A.beat * 0.45;
      const bw = cw * grow, bh = ch * grow;
      g.fillStyle = `rgb(${pr|0},${pg|0},${pb|0})`;
      g.fillRect(c * cw + shove - (bw - cw) / 2, r * ch - (bh - ch) / 2, bw + 1, bh + 1);
    }
  }
  g.imageSmoothingEnabled = true;
}

function drawFX(cfg) {
  FX.render({
    time, mode: FX.MODES[cfg.fx],
    bass: resp(A.bass), mid: resp(A.mid), high: resp(A.high),
    level: resp(A.level), beat: A.beat,
    palette: ART.palette.length ? ART.palette : [[120,120,140]],
    drops
  });
}

function drawScene(dt) {
  if (is('Poster')) return drawPoster(dt);
  const w = LO.width, h = LO.height;
  const cfg = LOOKS[look], G = gain();
  const energy = resp(A.level);

  lg.globalCompositeOperation = 'source-over';
  lg.globalAlpha = 1;

  if (is('Swirl') && PREV.width === w && PREV.height === h) {
    // Gentle tint instead of a hard clear: the previous frame stays visible
    // underneath, so nothing can show through as a hole.
    lg.globalAlpha = 0.05;
    lg.fillStyle = ART.dark;
    lg.fillRect(0, 0, w, h);
    lg.globalAlpha = 1;

    const rot = dt * (0.05 + energy * 0.45 + A.beat * 0.9);
    // A rotated rectangle no longer covers the original's corners. Scale up
    // by just enough to cover, scaled by aspect — too much and the trail
    // zooms outward instead of turning.
    const ar = Math.max(w / h, h / w);
    const k = 1.004 + rot * ar * 1.25;
    lg.save();
    lg.translate(w / 2, h / 2);
    lg.rotate(rot);
    lg.scale(k, k);
    lg.translate(-w / 2, -h / 2);
    lg.globalAlpha = 0.93;
    lg.drawImage(PREV, 0, 0);
    lg.restore();
    lg.globalAlpha = 1;
  } else {
    lg.fillStyle = ART.dark;
    lg.fillRect(0, 0, w, h);
  }

  // Base wash: the crushed artwork, upscaled and drifting. Overscanned so
  // the smeared edge pixels stay off-screen.
  if (ART.img && TINY.width) {
    const zoom = 1.45 + resp(A.bass) * 0.4;
    const dw = w * zoom, dh = h * zoom;
    lg.globalAlpha = is('Swirl') ? 0.22 : 0.8;   // Swirl keeps the trails visible
    lg.drawImage(TINY,
      (w - dw) / 2 + Math.sin(time * 0.035) * w * 0.05,
      (h - dh) / 2 + Math.cos(time * 0.028) * h * 0.05, dw, dh);
    lg.globalAlpha = 1;
  }

  const P = ART.palette.length ? ART.palette : [[120,120,140]];
  lg.globalCompositeOperation = cfg.comp;

  for (const b of blobs) {
    let x = (b.px + Math.sin(b.ph) * b.sx + b.ox) * w;
    let y = (b.py + Math.cos(b.ph * 1.7) * b.sy + b.oy) * h;
    if (is('Swirl')) {                           // orbit the centre
      const dx = x - w / 2, dy = y - h / 2;
      const c = Math.cos(b.orb), s = Math.sin(b.orb);
      x = w / 2 + dx * c - dy * s;
      y = h / 2 + dx * s + dy * c;
    }
    // ~3x radius swing between silence and peak, while the maximum stays
    // small enough that blobs read as separate shapes.
    const rad = b.r * Math.min(w, h) * (0.55 + (b.e * 0.78 + A.beat * 0.30) * cfg.rad);
    if (rad <= 0.5) continue;

    const [r, gg, bb] = P[b.ci % P.length];
    const a = (is('Glitch') ? 0.28 : 0.4) * (0.3 + b.e * cfg.alpha * 1.5);
    const gr = lg.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0,   `rgba(${r},${gg},${bb},${a})`);
    gr.addColorStop(0.55,`rgba(${r},${gg},${bb},${a * 0.42})`);
    gr.addColorStop(1,   `rgba(${r},${gg},${bb},0)`);
    lg.fillStyle = gr;
    lg.beginPath(); lg.arc(x, y, rad, 0, Math.PI * 2); lg.fill();
  }
  lg.globalCompositeOperation = 'source-over';

  if (is('Swirl')) {
    if (PREV.width !== w || PREV.height !== h) { PREV.width = w; PREV.height = h; }
    pg.clearRect(0, 0, w, h);
    pg.drawImage(LO, 0, 0);
  }

  // Upscale — the abstraction step.
  g.drawImage(LO, 0, 0, w, h, 0, 0, W, H);

  if (is('Glitch')) {
    const amt = Math.min(1, A.beat * 0.85 + Math.min(1, A.high * G) * 0.4);
    if (amt > 0.14) {
      const slices = 6, sh = H / slices;
      for (let i = 0; i < slices; i++) {
        if (Math.random() > 0.6) continue;
        const dx = (Math.random() * 2 - 1) * W * 0.17 * amt;
        g.drawImage(LO, 0, i * h / slices, w, h / slices, dx, i * sh, W, sh + 1);
      }
      if (amt > 0.32) {          // two more full-screen passes
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = 0.30 * amt;
        g.drawImage(channel('#ff0000'), 0, 0, w, h, -W * 0.014 * amt, 0, W, H);
        g.drawImage(channel('#00ffff'), 0, 0, w, h,  W * 0.014 * amt, 0, W, H);
        g.globalAlpha = 1;
        g.globalCompositeOperation = 'source-over';
      }
    }
  }

  // Vignette, at full resolution so it stays clean. Cached: only its
  // strength varies, and globalAlpha can carry that without rebuilding the
  // gradient object sixty times a second.
  if (VIGNETTE) {
    g.globalAlpha = Math.max(0, 0.55 - energy * 0.22);
    g.fillStyle = VIGNETTE;
    g.fillRect(0, 0, W, H);
    g.globalAlpha = 1;
  }
}

/* A little grain, rendered once and tiled — upscaled gradients band badly
   on dark screens without it. */
const GRAIN = (() => {
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d'), d = x.createImageData(s, s);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 118 + Math.random() * 20;
    d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255;
  }
  x.putImageData(d, 0, 0);
  return c;
})();

let last = performance.now(), videoClock = 0;
let hidden = false;
document.addEventListener('visibilitychange', () => {
  hidden = document.hidden;
  if (!hidden) { last = performance.now(); requestAnimationFrame(frame); }
});

function frame(now) {
  if (hidden) return;                 // resumed by visibilitychange
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; time += dt;
  A.update(dt);

  // A video keeps changing, so its crushed copy has to be re-read every
  // frame. Re-deriving the palette is far more expensive, so that happens a
  // few times a second — colours follow the footage without the cost.
  if (ART.isVideo && ART.img && ART.img.readyState >= 2) {
    renderTiny();
    // Re-upload the frame only when a shader look is actually on screen.
    if (LOOKS[look].fx) FX.setSource(ART.img, srcW(ART.img), srcH(ART.img));
    videoClock += dt;
    if (videoClock > 0.4) {
      videoClock = 0;
      try {
        const { palette, dark } = extractPalette(ART.img);
        ART.raw = palette;
        ART.palette = palette.map(vivify);
        ART.dark = dark;
        buildPoster();
        paintSwatches();
      } catch (e) { /* frame not decodable yet */ }
    }
  }

  updateDrops(dt);
  if (LOOKS[look].fx) { drawFX(LOOKS[look]); requestAnimationFrame(frame); return; }
  updateBlobs(dt);
  drawScene(dt);

  // Grain hides banding in the soft looks, but only muddies Poster's flat
  // blocks, which are meant to read as clean colour.
  if (!is('Poster') && GRAIN_SHEET) {
    g.globalCompositeOperation = 'overlay';
    g.globalAlpha = 0.035;
    g.drawImage(GRAIN_SHEET, 0, 0, W, H);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }

  requestAnimationFrame(frame);
}

/* =====================================================================
   NOW-PLAYING SEAM
   Recognition is deliberately not wired up — see README for why and what
   each option costs. Anything that can produce a title, artist and image
   URL only has to call setNowPlaying() and the visuals follow.
   ===================================================================== */
async function setNowPlaying({ title, artist, artworkUrl }) {
  const img = await loadImage(artworkUrl, true);   // needs CORS headers
  applyArtwork(img, title, artist);
}
window.setNowPlaying = setNowPlaying;

/* =====================================================================
   UI
   ===================================================================== */
const gate = document.getElementById('gate');
const hud  = document.getElementById('hud');
const errEl = document.getElementById('err');

function paintSwatches() {
  const el = document.getElementById('swatches');
  el.innerHTML = '';
  for (const [r, g2, b] of ART.raw) {
    const i = document.createElement('i');
    i.style.background = `rgb(${r},${g2},${b})`;
    el.appendChild(i);
  }
}

async function begin(kind) {
  errEl.textContent = '';
  try { await A.start(kind); }
  catch (e) {
    const n = e && e.name;
    if (e && e.message === 'NO_AUDIO_TRACK') errEl.textContent = 'No audio came through. Re-open the picker and tick “share audio” before confirming.';
    else if (n === 'NotAllowedError' || n === 'SecurityError') errEl.textContent = 'Permission denied. Allow access and try again.' +
      // Embedded pages are usually denied the microphone by the host
      // frame's permissions policy, and the error is indistinguishable
      // from the user clicking Block.
      (window.self !== window.top ? ' If this page is embedded, open it in its own browser tab — embedded pages are often blocked from using the microphone.' : '');
    else if (n === 'NotFoundError' || n === 'NotSupportedError' || n === 'TypeError') errEl.textContent = 'This browser can’t capture that source. Try the microphone.';
    else errEl.textContent = 'Couldn’t start audio: ' + (e && e.message ? e.message : 'unknown');
    return;
  }
  gate.classList.add('hidden');
  hud.classList.add('show');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => hud.classList.remove('show'), 5000);
}
document.getElementById('btn-mic').onclick  = () => begin('mic');
document.getElementById('btn-tab').onclick  = () => begin('tab');
document.getElementById('btn-demo').onclick = () => begin('demo');

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS || !navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
  const b = document.getElementById('btn-tab');
  b.disabled = true;
  b.querySelector('.txt span').textContent = 'Not available on this device — iOS can’t expose other apps’ audio. Use the microphone.';
}

// --- artwork input: file picker, drag-drop, or a pasted URL -----------
const fileInput = document.getElementById('file');
document.getElementById('art').onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files[0]) readFile(fileInput.files[0]); };

function readFile(file) {
  const name = file.name.replace(/\.[^.]+$/, '');

  if (file.type.startsWith('video/')) {
    // Object URLs are same-origin, so frames stay readable for palette
    // extraction. muted + playsInline are what let it autoplay on iOS.
    const v = document.createElement('video');
    v.src = URL.createObjectURL(file);
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
    v.onloadeddata = () => {
      v.play().catch(() => {});
      try { applyArtwork(v, name, '', true); }
      catch (e) { flash('Could not read that video.'); }
    };
    v.onerror = () => flash('Could not play that video. Try an MP4.');
    return;
  }

  const fr = new FileReader();
  // Read to a data URL rather than an object URL: data URLs are same-origin
  // so the canvas stays readable for palette extraction, even from file://.
  fr.onload = async () => {
    try { applyArtwork(await loadImage(fr.result), name, ''); }
    catch (e) { flash('Could not read that image.'); }
  };
  fr.readAsDataURL(file);
}

const dropEl = document.getElementById('drop');
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) dropEl.classList.add('on'); });
addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; dropEl.classList.remove('on');
  const f = e.dataTransfer.files[0];
  if (f && (f.type.startsWith('image/') || f.type.startsWith('video/'))) return readFile(f);
  const url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  if (url) tryUrl(url.trim());
});
addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) return readFile(item.getAsFile());
  const t = e.clipboardData?.getData('text');
  if (t && /^https?:\/\//.test(t.trim())) tryUrl(t.trim());
});

async function tryUrl(url) {
  try {
    applyArtwork(await loadImage(url, true), '', '');
  } catch (e) {
    flash(e.message === 'TAINTED'
      ? 'That image host doesn’t allow cross-origin reads, so its colours can’t be sampled. Save it and drop the file instead.'
      : 'Couldn’t load that image URL.');
  }
}

let flashT;
function flash(msg) {
  const n = document.getElementById('np');
  document.getElementById('np-t').textContent = msg;
  document.getElementById('np-a').textContent = '';
  document.getElementById('np-art').removeAttribute('src');
  n.classList.add('show');
  clearTimeout(flashT);
  flashT = setTimeout(() => n.classList.remove('show'), 5200);
}

document.getElementById('sens').onclick = e => {
  sens = (sens + 1) % SENS.length;
  e.target.textContent = SENS_NAME[sens];
};
const lookMenu = document.getElementById('lookmenu');
function buildLookMenu() {
  lookMenu.innerHTML = '';
  LOOKS.forEach((L, i) => {
    if (L.hidden) return;
    const b = document.createElement('button');
    b.textContent = L.name;
    b.setAttribute('aria-current', String(i === look));
    b.onclick = () => { setLookIndex(i); lookMenu.classList.remove('on'); };
    lookMenu.appendChild(b);
  });
}
function setLookIndex(i) {
  look = i;
  const usingFX = !!LOOKS[look].fx;
  document.body.classList.toggle('fx', usingFX);
  if (usingFX) {
    FX.resize(W, H);
    FX.setSource(ART.img, srcW(ART.img), srcH(ART.img));
  } else {
    // Clear the 2D canvas so a stale frame from before the shader look
    // cannot flash while the trail-fade looks build back up.
    g.fillStyle = ART.dark; g.fillRect(0, 0, W, H);
  }
  document.getElementById('look').textContent = LOOKS[look].name;
  buildLookMenu();
}
document.getElementById('look').onclick = e => {
  e.stopPropagation();
  buildLookMenu();
  lookMenu.classList.toggle('on');
};
addEventListener('pointerdown', e => {
  if (!lookMenu.contains(e.target) && e.target.id !== 'look') lookMenu.classList.remove('on');
});
document.getElementById('full').onclick = () => {
  if (!document.fullscreenElement) (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
  else document.exitFullscreen();
};
document.getElementById('restart').onclick = () => {
  A.stop(); hud.classList.remove('show'); gate.classList.remove('hidden');
};

let hideTimer;
function poke() {
  if (gate.classList.contains('hidden')) {
    hud.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => hud.classList.remove('show'), 3200);
  }
}
['pointermove','pointerdown','keydown'].forEach(ev => addEventListener(ev, poke));
addEventListener('keydown', e => {
  if (!gate.classList.contains('hidden')) return;
  if (e.key === ' ') {
    e.preventDefault();
    let n = look;
    do { n = (n + 1) % LOOKS.length; } while (LOOKS[n].hidden && n !== look);
    setLookIndex(n);
  }
  if (e.key.toLowerCase() === 'f') document.getElementById('full').click();
});

// --- boot -------------------------------------------------------------
(async () => {
  // Without WebGL the shader looks cannot render at all, so remove them
  // rather than leaving entries that would show a blank screen.
  if (!FX.init(document.getElementById('fxc'))) {
    for (let i = LOOKS.length - 1; i >= 0; i--) if (LOOKS[i].fx) LOOKS.splice(i, 1);
  }
  resize();
  setLookIndex(look);
  try { applyArtwork(await sampleArtwork()); } catch (e) { /* visuals still run */ }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

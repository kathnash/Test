<style>
  :root{
    --ui: rgba(255,255,255,.92);

    --line: rgba(255,255,255,.14);
    --panel: rgba(12,12,16,.72);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; background:#000; overflow:hidden; }
  body{
    font: 400 15px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    color: var(--ui); overscroll-behavior:none; touch-action:manipulation;
  }
  canvas#c, canvas#fxc{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  canvas#fxc{ display:none; }
  body.fx canvas#c{ display:none; }
  body.fx canvas#fxc{ display:block; }

  /* Two scrims: a radial one to sink the middle so the title holds, and a
     vertical one so the buttons sit on something near-solid. Type over a
     photograph is only ever as good as what is under it. */
  #gate::after{
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(125% 80% at 50% 32%, rgba(6,6,12,.04) 0%, rgba(6,6,12,.44) 54%, rgba(4,4,9,.82) 100%),
      linear-gradient(180deg, rgba(4,4,9,.42) 0%, rgba(4,4,9,0) 28%, rgba(4,4,9,.62) 80%, rgba(4,4,9,.86) 100%);
  }
  #gate > *{ position:relative; z-index:1; }
  @keyframes drift{
    from{ transform: scale(1.00) translate3d(-1.1%, -0.7%, 0); }
    to  { transform: scale(1.07) translate3d( 1.1%,  0.7%, 0); }
  }
  #gate.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  h1{
    font-size: clamp(30px, 8.2vw, 46px); font-weight:600; letter-spacing:-.035em;
    line-height:1.04; margin:0; max-width:13ch;
    text-shadow:0 2px 30px rgba(0,0,0,.55);
  }
  .sub{
    margin:16px 0 0; font-size:11.5px; font-weight:500;
    letter-spacing:.20em; text-transform:uppercase;
    color:rgba(255,255,255,.62);
  }
  .rule{ width:38px; height:1px; background:rgba(255,255,255,.28); margin:26px 0 0; }
  .choices{ display:flex; flex-direction:column; gap:7px; width:min(345px,100%); margin-top:26px; }
  button.src{
    appearance:none; cursor:pointer; text-align:left; display:flex; align-items:center; gap:13px;
    padding:13px 15px; border-radius:13px; border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.07); color:var(--ui); font:inherit;
    padding-left:17px;
    backdrop-filter:blur(20px) saturate(1.4); -webkit-backdrop-filter:blur(20px) saturate(1.4);
    transition: background .18s, border-color .18s, transform .12s;
  }
  button.src:hover{ background:rgba(255,255,255,.13); border-color:rgba(255,255,255,.34); }
  button.src:active{ transform:scale(.985); }
  button.src[disabled]{ opacity:.32; cursor:not-allowed; }
  .txt b{ display:block; font-weight:550; font-size:14.5px; letter-spacing:-.01em; }
  .txt span{ display:block; color:rgba(255,255,255,.5); font-size:12px; line-height:1.4; margin-top:2px; }
  #err{ color:#fda4af; font-size:13px; min-height:1em; max-width:40ch; margin:14px 0 0; }
  .note{ color:rgba(255,255,255,.34); font-size:11.5px; max-width:38ch; margin:16px 0 0; letter-spacing:.01em; }

  /* now-playing card */
  #np{
    position:fixed; z-index:15; left:0; right:0; bottom:74px;
    display:flex; align-items:center; gap:15px; justify-content:center;
    opacity:0; transform:translateY(8px); transition:opacity .8s ease, transform .8s ease;
    pointer-events:none; padding:0 20px;
  }
  #np.show{ opacity:1; transform:none; }
  #np img{
    width:62px; height:62px; border-radius:10px; object-fit:cover; flex:none;
    box-shadow:0 12px 40px rgba(0,0,0,.6); background:#222;
  }
  #np .meta{ text-align:left; min-width:0; }
  #np .t{ font-size:16px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #np .a{ font-size:13.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #hud{
    position:fixed; z-index:20; left:14px; right:14px; bottom:14px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    opacity:0; transition:opacity .45s ease; pointer-events:none;
  }
  #hud.show{ opacity:1; pointer-events:auto; }
  .chip{
    appearance:none; cursor:pointer; padding:9px 14px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    color:var(--ui); font:inherit; font-size:13px; transition:background .16s;
  }
  .chip:hover{ background:rgba(40,40,52,.85); }
  .spacer{ flex:1 1 auto; }
  #swatches{ display:flex; gap:4px; align-items:center; }
  #swatches i{ width:15px; height:15px; border-radius:4px; display:block; box-shadow:0 0 0 1px rgba(255,255,255,.15) inset; }

  #lookmenu{
    position:fixed; z-index:22; left:14px; bottom:60px; max-width:calc(100vw - 24px);
    display:none; flex-direction:column; gap:2px; padding:6px;
    border-radius:14px; border:1px solid var(--line); background:var(--panel);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    max-height:60vh; overflow-y:auto;
  }
  #lookmenu.on{ display:flex; }
  #lookmenu button{
    appearance:none; cursor:pointer; text-align:left; white-space:nowrap;
    padding:9px 16px; border-radius:9px; border:0; background:transparent;
    color:var(--ui); font:inherit; font-size:13.5px;
  }
  #lookmenu button:hover{ background:rgba(255,255,255,.10); }
  #lookmenu button[aria-current="true"]{ background:rgba(255,255,255,.9); color:#0a0a0d; }

  #drop{
    position:fixed; inset:0; z-index:40; display:none;
    align-items:center; justify-content:center;
    background:rgba(5,5,10,.86); backdrop-filter:blur(8px);
    font-size:19px; letter-spacing:-.01em;
  }
  #drop.on{ display:flex; }
  #drop div{ border:2px dashed rgba(255,255,255,.4); border-radius:20px; padding:44px 60px; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<canvas id="fxc"></canvas>

<div id="np"><img id="np-art" alt=""><div class="meta"><div class="t" id="np-t"></div><div class="a" id="np-a"></div></div></div>

<div id="gate">
  <h1>Sound reactive animation playground</h1>
  <p class="sub">created by Kath Nash</p>
  <span class="rule"></span>
  <div class="choices">
    <button class="src" id="btn-mic"><span class="txt"><b>Microphone</b><span>Play music out loud from anything. Works on phone and desktop.</span></span></button>
    <button class="src" id="btn-tab"><span class="txt"><b>This device's audio</b><span>Desktop only. Tick “share audio” in the picker.</span></span></button>
    <button class="src" id="btn-demo"><span class="txt"><b>Demo tone</b><span>No permissions needed.</span></span></button>
  </div>
  <p id="err"></p>
  <p class="note">Drop an image or a video on the page at any time to use it as the source.</p>
</div>

<div id="hud">
  <button class="chip" id="art">Image 1</button>
  <button class="chip" id="art2">Image 2</button>
  <button class="chip" id="look">Style: Poster</button>
  <button class="chip" id="tone">Tone: Blue</button>
  <button class="chip" id="sens">Sensitivity: mid</button>
  <button class="chip" id="rec">Record 10s</button>
  <button class="chip" id="full">Fullscreen</button>
  <span class="spacer"></span>
  <span id="swatches"></span>
  <button class="chip" id="restart">Audio source</button>
</div>

<div id="lookmenu"></div>
<div id="drop"><div>Drop artwork to use it</div></div>
<input type="file" id="file" accept="image/*,video/*" hidden>

<script src="audio.js"></script>
<script src="fx.js"></script>
<script>
"use strict";

/* =====================================================================
   ARTWORK  —  palette extraction
   ===================================================================== */
const ART = {
  img: null, palette: [], raw: [], dark: '#07070b', ready: false,
  title: '', artist: '', isVideo: false,
  lumLo: 0, lumHi: 1, medianNorm: 0.5
};

/* Colours sampled off a cover are usually far too dark to work as light —
   averaging a gradient-heavy image pulls everything toward the background.
   Push each one into a vivid band so the blobs actually glow, while keeping
   its hue, which is what makes the result still feel like the album. */
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r)      h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
    else if (mx === g) h = ((b - r) / d + 2) / 6;
    else               h = ((r - g) / d + 4) / 6;
  }
  const l = (mx + mn) / 2;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  return [h, s, l];
}
function hslToRgb(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h * 6) % 2 - 1));
  const m = l - c / 2;
  const t = h * 6;
  let r = 0, g = 0, b = 0;
  if (t < 1)      [r, g, b] = [c, x, 0];
  else if (t < 2) [r, g, b] = [x, c, 0];
  else if (t < 3) [r, g, b] = [0, c, x];
  else if (t < 4) [r, g, b] = [0, x, c];
  else if (t < 5) [r, g, b] = [x, 0, c];
  else            [r, g, b] = [c, 0, x];
  return [(r + m) * 255 | 0, (g + m) * 255 | 0, (b + m) * 255 | 0];
}
function vivify([r, g, b]) {
  let [h, s, l] = rgbToHsl(r, g, b);
  // A near-neutral has no meaningful hue — whatever tiny channel imbalance
  // it has is noise, and saturating it invents a colour that was never on
  // the cover. Greys stay grey; only lightness is normalised.
  if (s < 0.12) return hslToRgb(h, s, 0.42 + l * 0.26);
  s = Math.min(1, Math.max(s, 0.5) * 1.2);
  l = 0.44 + l * 0.26;              // compress into 0.44 – 0.70
  return hslToRgb(h, s, l);
}

// Median-cut is overkill here. Quantise into coarse buckets, take the most
// populous, then greedily reject anything too close to a colour already
// chosen — that rejection step is what stops a photo returning five
// near-identical browns.
function extractPalette(img, count = 5) {
  const S = 56;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const x = cv.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, S, S);   // works for <img> and <video> alike

  let data;
  try {
    data = x.getImageData(0, 0, S, S).data;
  } catch (e) {
    // Tainted canvas: a cross-origin image without CORS headers.
    throw new Error('TAINTED');
  }

  const buckets = new Map();
  let rs = 0, gs = 0, bs = 0, n = 0;
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 128) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    rs += r; gs += g; bs += b; n++;
    const key = (r >> 4) << 8 | (g >> 4) << 4 | (b >> 4);
    const e = buckets.get(key);
    if (e) { e.r += r; e.g += g; e.b += b; e.n++; }
    else buckets.set(key, { r, g, b, n: 1 });
  }
  if (!n) throw new Error('EMPTY');

  const all = [...buckets.values()]
    .map(e => ({ r: e.r / e.n, g: e.g / e.n, b: e.b / e.n, n: e.n }))
    // Weight by colourfulness so a dominant grey background doesn't win
    // every slot on an otherwise vivid cover.
    .map(c => {
      const mx = Math.max(c.r, c.g, c.b), mn = Math.min(c.r, c.g, c.b);
      const sat = mx === 0 ? 0 : (mx - mn) / mx;
      return { ...c, score: c.n * (0.35 + sat * 1.5) };
    })
    .sort((a, b) => b.score - a.score);

  const picked = [];
  const dist2 = (a, b) => (a.r-b.r)**2 + (a.g-b.g)**2 + (a.b-b.b)**2;
  for (const c of all) {
    if (picked.length >= count) break;
    if (picked.every(p => dist2(p, c) > 2100)) picked.push(c);
  }
  // Relax the spacing rule if the cover genuinely is near-monochrome.
  for (const c of all) { if (picked.length >= count) break; if (!picked.includes(c)) picked.push(c); }

  const avg = { r: rs / n, g: gs / n, b: bs / n };

  // Median, not mean. The threshold needs to sit at the tone the image is
  // mostly made of, and a mean is dragged around by a small bright subject
  // on a dark ground — which is exactly the case that inverted.
  const hist = new Uint32Array(64);
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 128) continue;
    const l = (data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114) / 255;
    hist[Math.min(63, Math.max(0, Math.round(l * 63)))]++;
  }
  // Percentiles, so the tone curve can be expressed against the image's own
  // range. An absolute threshold has almost no room to work with on a dark
  // image — its ground sits near zero, and any soft transition band is wider
  // than the space beneath it, so the ground can never read as fully exposed.
  const pct = f => {
    let a = 0;
    for (let i = 0; i < 64; i++) { a += hist[i]; if (a >= n * f) return i / 63; }
    return 1;
  };
  const lumLo = pct(0.08), lumHi = pct(0.92);
  const medianLum = pct(0.5);
  const span = Math.max(0.04, lumHi - lumLo);
  const medianNorm = Math.min(1, Math.max(0, (medianLum - lumLo) / span));
  return {
    lumLo, lumHi, medianNorm,
    palette: picked.slice(0, count).map(c => [c.r | 0, c.g | 0, c.b | 0]),
    dark: `rgb(${avg.r * 0.34 | 0},${avg.g * 0.33 | 0},${avg.b * 0.38 | 0})`
  };
}

// A <video> reports its size as videoWidth/videoHeight; an <img> as
// width/height. Everything downstream goes through these.
const srcW = m => m ? (m.videoWidth || m.width || 0) : 0;
const srcH = m => m ? (m.videoHeight || m.height || 0) : 0;

/* Everything downstream reads from this bounded working copy, never from the
   original media. A phone video is commonly 1080p or 4K, and the source was
   previously touched four separate ways — the crushed copy every frame, the
   palette and the Poster grid every 0.4s (each with a getImageData readback),
   and the WebGL texture upload every frame. At 4K each of those is enormous,
   and the palette and grid work ran whichever look was on screen, which is
   why changing look didn't help. One downscale per frame caps all of it. */
const SRC = document.createElement('canvas');
const sg  = SRC.getContext('2d', { willReadFrequently: true });
const SRC_MAX = 512;

function updateSource() {
  const w = srcW(ART.img), h = srcH(ART.img);
  if (!ART.img || !w || !h) return false;
  const k  = Math.min(1, SRC_MAX / Math.max(w, h));
  const cw = Math.max(2, Math.round(w * k)), ch = Math.max(2, Math.round(h * k));
  if (SRC.width !== cw || SRC.height !== ch) { SRC.width = cw; SRC.height = ch; }
  sg.drawImage(ART.img, 0, 0, cw, ch);
  return true;
}

/* Second source layer, for the looks that composite two pictures. Kept
   deliberately thin: a downscaled canvas and a media handle, nothing else.
   The palette, the Poster grid and the tone statistics all stay derived from
   layer one, so adding a second picture cannot change how any existing look
   behaves. */
const LAYER2 = { img: null, isVideo: false, dirty: false, rvfc: false,
                lumLo: 0, lumHi: 1, medianNorm: 0.5 };
const SRC2 = document.createElement('canvas');
const sg2  = SRC2.getContext('2d');

function updateSource2() {
  const el = LAYER2.img;
  const w = srcW(el), h = srcH(el);
  if (!el || !w || !h) return false;
  const k  = Math.min(1, SRC_MAX / Math.max(w, h));
  const cw = Math.max(2, Math.round(w * k)), ch = Math.max(2, Math.round(h * k));
  if (SRC2.width !== cw || SRC2.height !== ch) { SRC2.width = cw; SRC2.height = ch; }
  sg2.drawImage(el, 0, 0, cw, ch);
  return true;
}

// The second picture's own tone range, so looks that threshold it can do so
// against its own exposure rather than the first picture's.
function readStats2() {
  if (!SRC2.width) return;
  try {
    const { lumLo, lumHi, medianNorm } = extractPalette(SRC2);
    LAYER2.lumLo = lumLo; LAYER2.lumHi = lumHi; LAYER2.medianNorm = medianNorm;
  } catch (e) {}
}

function applyLayer2(el, isVideo = false) {
  LAYER2.img = el; LAYER2.isVideo = isVideo;
  if (updateSource2()) { FX.setSourceB(SRC2, SRC2.width, SRC2.height); readStats2(); }
  buildPoster();          // Poster samples the second picture on its own lattice
  paintLayer2Chip();
}

function clearLayer2() {
  if (LAYER2.img && LAYER2.isVideo) { try { LAYER2.img.pause(); } catch (e) {} }
  LAYER2.img = null; LAYER2.isVideo = false;
  FX.setSourceB(null);
  buildPoster();
  paintLayer2Chip();
}

function applyArtwork(img, title = '', artist = '', isVideo = false) {
  ART.img = img;
  updateSource();
  const { palette, dark, lumLo, lumHi, medianNorm } = extractPalette(SRC);
  ART.lumLo = lumLo; ART.lumHi = lumHi; ART.medianNorm = medianNorm;
  ART.raw = palette;                    // true source colours, shown as swatches
  ART.palette = palette.map(vivify);    // brightened, used to paint
  ART.dark = dark;
  ART.title = title; ART.artist = artist; ART.ready = true;
  ART.isVideo = isVideo;
  renderTiny();
  buildPoster();
  seedBlobs();
  paintSwatches();
  FX.setSource(SRC, SRC.width, SRC.height);

  const np = document.getElementById('np');
  if (title || artist) {
    const thumb = document.getElementById('np-art');
    if (isVideo) thumb.removeAttribute('src'); else thumb.src = img.src;
    document.getElementById('np-t').textContent = title;
    document.getElementById('np-a').textContent = artist;
    np.classList.add('show');
    clearTimeout(applyArtwork._t);
    applyArtwork._t = setTimeout(() => np.classList.remove('show'), 8000);
  } else np.classList.remove('show');
}

function loadImage(src, crossOrigin) {
  return new Promise((res, rej) => {
    const im = new Image();
    if (crossOrigin) im.crossOrigin = 'anonymous';
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('LOAD_FAILED'));
    im.src = src;
  });
}

   takes five dominant colours off this and every style paints with them, so
   a fourth hue in here is a fourth hue on screen, and any exposed ground
   would be a colour too. Hence no background: the frame starts filled and
   every wash is laid over it opaque at its core.

/* =====================================================================
   RENDER
   The whole scene is drawn into a tiny offscreen buffer and then scaled
   up to the display with smoothing. That upscale IS the abstraction — it
   melts the artwork into soft gradient fields for free, and costs a
   fraction of a real blur filter.
   ===================================================================== */
const cv = document.getElementById('c');
const g  = cv.getContext('2d', { alpha: false });
const LO = document.createElement('canvas');
const lg = LO.getContext('2d');

/* The artwork is first crushed to a handful of pixels, and that is what
   gets painted underneath. Drawing the cover itself — even small and
   blurred — just looks like a blurred cover; at this size only the broad
   composition and colour placement survive, which is the part worth
   keeping. TINY_W sets how abstract the result is. */
const TINY = document.createElement('canvas');
const tg = TINY.getContext('2d');
const TINY_W = 7;

let W = 0, H = 0, DPR = 1, LOW = 132;
let VIGNETTE = null, GRAIN_SHEET = null;

function renderTiny() {
  if (!SRC.width) return;
  const ar = LO.height / Math.max(1, LO.width);
  TINY.width = TINY_W;
  TINY.height = Math.max(3, Math.round(TINY_W * ar));
  const s = Math.max(TINY.width / SRC.width, TINY.height / SRC.height);
  const dw = SRC.width * s, dh = SRC.height * s;
  tg.clearRect(0, 0, TINY.width, TINY.height);
  tg.drawImage(SRC, (TINY.width - dw) / 2, (TINY.height - dh) / 2, dw, dh);
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  const ar = H / W;
  LO.width = LOW; LO.height = Math.max(8, Math.round(LOW * ar));
  PREV.width = LO.width; PREV.height = LO.height;

  VIGNETTE = g.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.3,
                                    W/2, H/2, Math.max(W,H) * 0.78);
  VIGNETTE.addColorStop(0, 'rgba(0,0,0,0)');
  VIGNETTE.addColorStop(1, 'rgba(0,0,0,1)');

  GRAIN_SHEET = document.createElement('canvas');
  GRAIN_SHEET.width = Math.max(1, Math.round(W));
  GRAIN_SHEET.height = Math.max(1, Math.round(H));
  const gsx = GRAIN_SHEET.getContext('2d');
  for (let y = 0; y < GRAIN_SHEET.height; y += 128)
    for (let x = 0; x < GRAIN_SHEET.width; x += 128) gsx.drawImage(GRAIN, x, y);

  FX.resize(W, H);
  renderTiny();
  buildPoster();
  seedBlobs();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));

/* Looks that differ in kind, not in degree. Drift is calm and ambient;
   Poster quantises the artwork into flat hard-edged blocks; Swirl feeds the
   previous frame back through a rotation to build a vortex; Glitch tears the
   image into slices and splits the colour channels.
   Referenced by name, never by index, so the order can change freely. */
const LOOKS = [
  // hidden:true keeps a look fully implemented but out of the picker, so
  // it can be brought back by deleting one word.
  { name:'Drift',  move:0.85, kick:0.70, rad:0.85, alpha:0.55, comp:'source-over', hidden:true },
  { name:'Poster', move:0.50, kick:1.00, rad:1.00, alpha:0.60, comp:'source-over' },
  { name:'Swirl',  move:1.00, kick:0.95, rad:1.00, alpha:0.60, comp:'source-over', hidden:true },
  { name:'Glitch', move:1.40, kick:1.50, rad:1.15, alpha:0.72, comp:'lighter', hidden:true },
  // Shader looks: the artwork is bent rather than painted over.
  { name:'Blur',   fx:'Blur'   },
  { name:'Punch',  fx:'Punch'  },
  { name:'Dots',   fx:'Dots'   },
  { name:'Fields', fx:'Fields' },
  { name:'Ripple', fx:'Ripple' },
  { name:'Ribbed', fx:'Ribbed' },
  { name:'Marble', fx:'Marble', hidden:true },
  { name:'Lens',   fx:'Lens'   },
  { name:'Cyanotype', fx:'Cyanotype' }
];
let look = LOOKS.findIndex(l => !l.hidden);
let time = 0;
const is = name => LOOKS[look].name === name;

// Sensitivity is a user control because the right value depends entirely on
// how loud the room is and how far away the phone is — no fixed default is
// correct for both a kitchen speaker and a club.
/* Tone presets, used by Cyanotype's chemistry and by Fields' ground. One
   choice sets the whole ramp rather than exposing shadows and highlights
   separately: the four printed tones follow a hue arc, not a straight line
   from paper to deep, and two independent pickers would let that arc be
   broken in ways no darkroom process produces.

   `bg` is Fields' ground and is a real colour, not a paper tint. The first
   pass set every ground to a near-white version of its tone, which was
   working exactly as written and looked completely broken: white with a
   whisper of colour in it is white. */
const TONES = [
  { name: 'Blue',
    paper: [0.929, 0.945, 1.000], light: [0.478, 0.612, 0.937],
    mid:   [0.098, 0.239, 0.808], deep:  [0.035, 0.090, 0.392],
    coatPale: [0.812, 0.796, 0.871], coatMid: [0.541, 0.522, 0.667],
    coatDeep: [0.278, 0.267, 0.420], bg: [0.231, 0.475, 0.859] },

    mid:   [0.055, 0.639, 0.208], deep:  [0.020, 0.286, 0.106],
    coatPale: [0.808, 0.843, 0.792], coatMid: [0.529, 0.596, 0.502],
    coatDeep: [0.259, 0.337, 0.243], bg: [0.043, 0.549, 0.314] },
  { name: 'Yellow',
    paper: [1.000, 0.980, 0.898], light: [1.000, 0.855, 0.353],
    mid:   [0.965, 0.729, 0.031], deep:  [0.451, 0.325, 0.020],
    coatPale: [0.867, 0.843, 0.769], coatMid: [0.639, 0.588, 0.435],
    coatDeep: [0.361, 0.310, 0.184], bg: [0.969, 0.890, 0.000] },
  { name: 'Red',
    paper: [1.000, 0.937, 0.929], light: [0.965, 0.541, 0.478],
    mid:   [0.851, 0.086, 0.086], deep:  [0.380, 0.031, 0.043],
    coatPale: [0.867, 0.804, 0.792], coatMid: [0.635, 0.502, 0.494],
    coatDeep: [0.361, 0.243, 0.251], bg: [0.800, 0.153, 0.173] },
  // Paper. Cyanotype prints this one in neutral greys, which is the only
  // ramp that makes sense for a tone with no hue in it.
  { name: 'White',
    paper: [0.961, 0.945, 0.949], light: [0.639, 0.627, 0.635],
    mid:   [0.267, 0.263, 0.271], deep:  [0.086, 0.086, 0.094],
    coatPale: [0.851, 0.839, 0.843], coatMid: [0.576, 0.569, 0.576],
    coatDeep: [0.290, 0.286, 0.294], bg: [0.961, 0.945, 0.949] }
];
let tone = 0;
const toneOf = () => TONES[tone];

const SENS = [1, 1.9, 3.2];
const SENS_NAME = ['Sensitivity: low', 'Sensitivity: mid', 'Sensitivity: high'];
let sens = 1;
const gain = () => SENS[sens];

/* Soft knee rather than min(1, v * gain). A hard clamp pins every value at
   maximum as soon as gain is raised, which flattens the dynamics and makes
   HIGHER sensitivity look LESS alive — the opposite of the control's job.
   This curve approaches 1 without ever reaching it, so quiet material gets
   lifted while loud material still has somewhere left to go. */
const resp = v => 1 - Math.exp(-v * gain() * 1.8);

let blobs = [];
function seedBlobs() {
  const n = 9;
  blobs = [];
  const GOLD = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    blobs.push({
      ci: i % Math.max(1, ART.palette.length),
      // Golden-angle seeding spreads the starting points evenly instead of
      // letting Math.random() clump them.
      px: 0.5 + Math.cos(i * GOLD) * (0.14 + (i % 3) * 0.13),
      py: 0.5 + Math.sin(i * GOLD) * (0.14 + (i % 3) * 0.13),
      sx: 0.11 + Math.random() * 0.20,
      sy: 0.10 + Math.random() * 0.20,
      ph: Math.random() * 6.28,
      r:  0.17 + Math.random() * 0.19,
      band: i % 5,
      e: 0, ox: 0, oy: 0, vx: 0, vy: 0, orb: 0
    });
  }
}

const bandVal = i => [A.bass, A.mid, A.high, A.air, A.level][i] || 0;

/* Shared by Ripple (expanding rings) and Marble (ink pushing the pattern
   outward). Four at a time is all the shader carries. */
let drops = [], lastDrop = -9;
function updateDrops(dt) {
  for (const d of drops) d.age += dt;
  drops = drops.filter(d => d.age < 6);
  // A ring on most beats, where before it was one per 1.15s and most beats
  // produced nothing at all. What made this frantic originally was not the
  // count but the decay: four ring trains overlapping for seconds each, so
  // the surface never settled. The rings now fade in well under a second, so
  // one or two are legible at a time and each still lands on its beat.
  if (A.beatFlash > 0.9 && time - lastDrop > 0.30) {
    lastDrop = time;
    drops.push({ x: 0.15 + Math.random() * 1.2, y: Math.random(), age: 0 });
    if (drops.length > 4) drops.shift();
  }
}

/* The fix for "it barely moves": audio drives the rate of motion and kicks
   the blobs around, instead of only scaling a shape that a fixed clock was
   moving anyway. */
function updateBlobs(dt) {
  const cfg = LOOKS[look], G = gain();
  for (const b of blobs) {
    const target = resp(bandVal(b.band));
    b.e += (target - b.e) * (target > b.e ? 0.45 : 0.12);

    // Rate is deliberately almost independent of sustained loudness. Music
    // is loud continuously, so tying speed to level yields constant fast
    // motion that reads as unrelated to the sound. Transients do the moving.
    b.ph  += dt * (0.030 + b.e * 0.26) * cfg.move;
    b.orb += dt * (0.018 + b.e * 0.14) * cfg.move;

    if (A.beatFlash > 0.9) {
      const ang = Math.random() * Math.PI * 2;
      const p = (0.12 + b.e * 0.42) * G * cfg.kick;
      b.vx += Math.cos(ang) * p;
      b.vy += Math.sin(ang) * p;
    }
    b.vx *= 0.93; b.vy *= 0.93;
    b.ox = (b.ox + b.vx * dt) * 0.985;   // decay back toward home
    b.oy = (b.oy + b.vy * dt) * 0.985;
  }
}

/* Swirl feeds the last frame back in, rotated and slightly enlarged. Each
   frame's colour therefore spirals outward for several seconds, which is
   what reads as a vortex rather than as moving circles. */
const PREV = document.createElement('canvas');
const pg = PREV.getContext('2d');
let swirlAngle = 0;

/* Isolates one colour channel of the low-res buffer, for Glitch's chromatic
   split. Reassigning width both resizes and clears it. */
const CH = document.createElement('canvas');
const cg = CH.getContext('2d');
function channel(colour) {
  if (CH.width !== LO.width || CH.height !== LO.height) {
    CH.width = LO.width; CH.height = LO.height;
  }
  cg.globalCompositeOperation = 'copy';   // clears and draws in one pass
  cg.drawImage(LO, 0, 0);
  cg.globalCompositeOperation = 'multiply';
  cg.fillStyle = colour;
  cg.fillRect(0, 0, CH.width, CH.height);
  return CH;
}

/* Poster is the graphic counterpart to the soft looks. The artwork is read
   at a coarse grid, each cell snapped to its nearest extracted colour, and
   drawn as flat rectangles with no smoothing — so it stays unmistakably the
   album while reading as hard-edged colour blocks rather than a blur. */
const POSTER = { cols: 0, rows: 0, cell: null, rgb: null, rgb2: null, str: null, sorted: null };
// 0 = pure palette, 1 = the picture untouched. Partway keeps the flat
// poster feel while letting the image read.
const POSTER_IMAGE = 0.74;

function buildPoster() {
  if (!SRC.width || !ART.palette.length) return;
  const cols = 24;   // finer grid reads more of the picture
  const rows = Math.max(3, Math.round(cols * (H || 1) / (W || 1)));
  const c = document.createElement('canvas');
  c.width = cols; c.height = rows;
  const x = c.getContext('2d', { willReadFrequently: true });
  const s = Math.max(cols / SRC.width, rows / SRC.height);
  const dw = SRC.width * s, dh = SRC.height * s;
  try {
    x.drawImage(SRC, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
    const d = x.getImageData(0, 0, cols, rows).data;
    const cell = new Uint8Array(cols * rows);
    // Keep each cell's true colour as well as its palette index, so the
    // blocks can be blended back toward the actual picture instead of being
    // limited to five flat tones.
    const rgb = new Uint8Array(cols * rows * 3);
    // How far each cell departs from its own neighbourhood — local contrast,
    // not distance from any single global colour. What makes something read
    // as a subject is that it differs from what is around it: a kite does not
    // match the sky next to it, while a clear sky matches its surroundings
    // everywhere no matter how far its top is from its bottom. Measured
    // against a global colour instead, the extremes of a gradient score as
    // highly as the subject does, which is what laid a band of pale blue
    // squares along the bottom of a sky.
    // Specifically the *median* distance to the neighbours, not the distance
    // to their mean. A mean is not robust to the very outliers this is trying
    // to find: a single kite cell drags the mean of every neighbourhood it
    // falls in, so the sky cells around it scored high too and each kite came
    // out wearing a five-cell halo of sky-coloured blocks. Against a
    // background this smooth there is no local variation for that
    // contamination to hide in. A median ignores a few odd neighbours by
    // construction — the kite cell sees 24 neighbours of sky and scores high,
    // while the sky cell beside it sees 23 of sky and scores nothing.
    const n = cols * rows;
    const R = 2;                    // neighbourhood radius, in cells
    const str = new Float32Array(n);
    const nb = new Float64Array((2*R + 1) * (2*R + 1));
    let sum = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const i = r * cols + c, j = i * 4;
        let k = 0;
        for (let dy = -R; dy <= R; dy++) {
          const yy = r + dy;
          if (yy < 0 || yy >= rows) continue;
          for (let dx = -R; dx <= R; dx++) {
            const xx = c + dx;
            if (xx < 0 || xx >= cols || (dx === 0 && dy === 0)) continue;
            const q = (yy * cols + xx) * 4;
            // Insertion sort as we go: the arrays are 24 long, so this beats
            // building one and sorting it, and it runs per decoded video frame.
            const v = Math.hypot(d[j] - d[q], d[j+1] - d[q+1], d[j+2] - d[q+2]);
            let m = k++;
            while (m > 0 && nb[m-1] > v) { nb[m] = nb[m-1]; m--; }
            nb[m] = v;
          }
        }
        str[i] = k ? nb[k >> 1] : 0;
        sum += str[i];
      }
    }
    // Expressed as a z-score against the *bulk* of the frame, not as a
    // fraction of the maximum, so the bar means the same thing on a sparse
    // frame and a busy one. Mean absolute deviation rather than standard
    // deviation, so a handful of extreme cells do not inflate the spread they
    // are supposed to be standing out from.
    const mean = sum / n;
    let mad = 0;
    for (let i = 0; i < n; i++) mad += Math.abs(str[i] - mean);
    // Floored, so a perfectly flat frame gives every cell a z of about zero
    // and stays a flat ground instead of dividing by nothing.
    mad = Math.max(6, mad / n);
    for (let i = 0; i < n; i++) str[i] = (str[i] - mean) / mad;

    for (let i = 0; i < cols * rows; i++) {
      const r = d[i*4], g2 = d[i*4+1], b = d[i*4+2];
      rgb[i*3] = r; rgb[i*3+1] = g2; rgb[i*3+2] = b;
      let best = 0, bd = Infinity;
      for (let p = 0; p < ART.palette.length; p++) {
        const [pr, pg, pb] = ART.palette[p];
        const dist = (pr-r)**2 + (pg-g2)**2 + (pb-b)**2;
        if (dist < bd) { bd = dist; best = p; }
      }
      cell[i] = best;
    }
    // The same lattice sampled from layer two, so a cell can be painted in
    // either picture's colour without needing a second grid or a second
    // selection pass. Selection stays driven by layer one throughout.
    let rgb2 = null;
    if (LAYER2.img && SRC2.width) {
      rgb2 = new Uint8Array(n * 3);
      const s2 = Math.max(cols / SRC2.width, rows / SRC2.height);
      const dw2 = SRC2.width * s2, dh2 = SRC2.height * s2;
      x.clearRect(0, 0, cols, rows);
      x.drawImage(SRC2, (cols - dw2) / 2, (rows - dh2) / 2, dw2, dh2);
      const d2 = x.getImageData(0, 0, cols, rows).data;
      for (let i = 0; i < n; i++) {
        rgb2[i*3] = d2[i*4]; rgb2[i*3+1] = d2[i*4+1]; rgb2[i*3+2] = d2[i*4+2];
      }
    }
    POSTER.rgb2 = rgb2;
    POSTER.cols = cols; POSTER.rows = rows; POSTER.cell = cell; POSTER.rgb = rgb; POSTER.str = str;
    // Sorted copy so the threshold can be chosen by rank. Thresholding on
    // the value itself gives wildly different coverage per image — a
    // gradient with one small subject left the screen empty at any level
    // that a busy cover filled completely.
    POSTER.sorted = Float32Array.from(str).sort();
  } catch (e) { POSTER.cell = null; }   // tainted source
}

function drawPoster(dt) {
  if (!POSTER.cell) { g.fillStyle = ART.dark; g.fillRect(0, 0, W, H); return; }
  const { cols, rows, cell, str } = POSTER;
  const cw = W / cols, ch = H / rows;

  // Flat ground of the artwork's dominant colour. Quiet passages leave most
  // of the screen as this, with only the most distinctive cells standing on
  // it; loud passages drop the threshold and the composition fills in.
  // The ground takes the artwork's *true* dominant colour, not the vivified
  // one the blocks are painted from. vivify forces saturation to at least
  // 0.5 and remaps lightness into 0.44-0.70, which is what gives the cells
  // their punch and what makes a deep or muted background come back as a
  // vivid mid-tone that was never in the picture. Blocks want the lift; a
  // ground that fills most of the frame wants to be the colour you saw.
  const dom = (ART.raw && ART.raw[0]) || ART.palette[0] || [90, 90, 110];
  g.fillStyle = `rgb(${dom[0]|0},${dom[1]|0},${dom[2]|0})`;
  g.fillRect(0, 0, W, H);
  g.imageSmoothingEnabled = false;

  // Fraction of cells to draw, from a sparse handful in near-silence to the
  // full composition at peak.
  const fill = resp(A.level);
  // Slow breath so cells drift across the threshold on their own. Without
  // an idle term Poster is genuinely static on a still image in silence.
  const breath = Math.sin(time * 0.062) * 0.5 + 0.5;
  const frac = Math.min(0.94, 0.045 + Math.pow(fill, 1.55) * 0.68
                              + A.beat * 0.10 + breath * 0.055);
  const sorted = POSTER.sorted;
  const cut = frac >= 0.999 ? -1e9 : sorted[Math.min(sorted.length - 1,
                Math.floor((1 - frac) * sorted.length))];
  // A cell has to clear an absolute bar as well as the rank cut. Rank alone
  // always draws a fixed *fraction*, whatever is in the frame, so a clear sky
  // with a few kites in it filled up with faintly-different blue squares —
  // the sky cells were nowhere near distinctive, but they were the next ones
  // in line. Anything sitting in the bulk of the distribution is background
  // by definition and stays as flat ground. Loud passages lower the bar to
  // bring in a second tier of detail, never far enough to admit the bulk.
  const zFloor = 1.5 - fill * 0.45;

  // Layer two arrives as a cluster, not a scatter: a patch of cells that
  // wanders the frame and opens up on a strong transient. Its radius has its
  // own fast-attack, slow-release envelope so it bursts on the hit and
  // lingers, rather than tracking the level up and down.
  const cl = POSTER.rgb2 ? clusterR : 0;
  const clx = (0.5 + Math.sin(time * 0.081) * 0.34) * cols;
  const cly = (0.5 + Math.cos(time * 0.063) * 0.36) * rows;

  for (let r = 0; r < rows; r++) {
    // Each row is displaced by one frequency band, so the picture shears
    // apart along the music instead of every block moving together.
    const e = resp(bandVal(r % 5));
    // Rows sway gently on their own clock, offset per row so the field
    // never moves as one block.
    const sway = Math.sin(time * 0.085 + r * 0.55) * 0.09;
    const shove = (r % 2 ? 1 : -1) * (e * 0.20 + A.beat * 0.45 + sway) * cw * 2.4;
    // Overscan by two cells each side. A shoved row would otherwise pull away
    // from the screen edge and expose the ground colour — the same gap that
    // made Swirl look like it was punched through to the background.
    for (let c = -2; c <= cols + 1; c++) {
      const src = c < 0 ? 0 : c > cols - 1 ? cols - 1 : c;
      const idx = r * cols + src;
      const st = str[idx];
      // Inside the cluster the bar drops, so layer two does not merely
      // recolour the cells that were already showing — it brings its own
      // cells with it, which is what makes it read as a burst.
      const cd = cl > 0 ? Math.hypot(src - clx, r - cly) / cl : 9;
      const inCl = cd < 1 ? 1 - cd * cd : 0;
      const bar = (cut > zFloor ? cut : zFloor) - inCl * 1.35;
      if (st < bar) continue;                 // ground shows through
      // Ease in over the last stretch above the threshold so cells arrive
      // rather than popping.
      const ease = Math.min(1, (st - bar) / 0.55);
      const shift = (A.beat > 0.55 && (r + c) % 3 === 0) ? 1 : 0;
      const pal = ART.palette[(cell[idx] + shift) % ART.palette.length];
      const k = POSTER_IMAGE;
      const rgbS = inCl > 0.18 && POSTER.rgb2 ? POSTER.rgb2 : POSTER.rgb;
      const pr = pal[0] + (rgbS[idx*3]     - pal[0]) * k;
      const pg = pal[1] + (rgbS[idx*3 + 1] - pal[1]) * k;
      const pb = pal[2] + (rgbS[idx*3 + 2] - pal[2]) * k;
      // Blocks grow toward their neighbours on transients and open up gaps
      // of the ground colour when the music is quiet.
      const grow = (0.50 + ease * 0.55) *
                   (1 + e * 0.28 + A.beat * 0.45 + Math.sin(time * 0.11 + r * 0.4) * 0.05);
      const bw = cw * grow, bh = ch * grow;
      const lx = c * cw + shove - (bw - cw) / 2;
      const ly = r * ch - (bh - ch) / 2;
      const x0 = Math.round(lx), y0 = Math.round(ly);
      const x1 = Math.round(lx + bw), y1 = Math.round(ly + bh);
      g.fillStyle = `rgb(${pr|0},${pg|0},${pb|0})`;
      g.fillRect(x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0));
    }
  }
  g.imageSmoothingEnabled = true;
}

function drawFX(cfg) {
  FX.render({
    time, phase: ripplePhase, swell: rippleSwell,
    lumLo: ART.lumLo, lumHi: ART.lumHi, medianNorm: ART.medianNorm,
    dev: cyanoDev, shuffle: shufflePhase, morph: morphPhase,
    lensShuffle, focus: blurFocus, tone: toneOf(),
    lumLoB: LAYER2.lumLo, lumHiB: LAYER2.lumHi, medianNormB: LAYER2.medianNorm,
    mode: FX.MODES[cfg.fx],
    bass: resp(A.bass), mid: resp(A.mid), high: resp(A.high),
    level: resp(A.level), beat: A.beat,
    palette: ART.palette.length ? ART.palette : [[120,120,140]],
    drops
  });
}

function drawScene(dt) {
  if (is('Poster')) return drawPoster(dt);
  const w = LO.width, h = LO.height;
  const cfg = LOOKS[look], G = gain();
  const energy = resp(A.level);

  lg.globalCompositeOperation = 'source-over';
  lg.globalAlpha = 1;

  if (is('Swirl') && PREV.width === w && PREV.height === h) {
    // Gentle tint instead of a hard clear: the previous frame stays visible
    // underneath, so nothing can show through as a hole.
    lg.globalAlpha = 0.05;
    lg.fillStyle = ART.dark;
    lg.fillRect(0, 0, w, h);
    lg.globalAlpha = 1;

    const rot = dt * (0.05 + energy * 0.45 + A.beat * 0.9);
    // A rotated rectangle no longer covers the original's corners. Scale up
    // by just enough to cover, scaled by aspect — too much and the trail
    // zooms outward instead of turning.
    const ar = Math.max(w / h, h / w);
    const k = 1.004 + rot * ar * 1.25;
    lg.save();
    lg.translate(w / 2, h / 2);
    lg.rotate(rot);
    lg.scale(k, k);
    lg.translate(-w / 2, -h / 2);
    lg.globalAlpha = 0.93;
    lg.drawImage(PREV, 0, 0);
    lg.restore();
    lg.globalAlpha = 1;
  } else {
    lg.fillStyle = ART.dark;
    lg.fillRect(0, 0, w, h);
  }

  // Base wash: the crushed artwork, upscaled and drifting. Overscanned so
  // the smeared edge pixels stay off-screen.
  if (ART.img && TINY.width) {
    const zoom = 1.45 + resp(A.bass) * 0.4;
    const dw = w * zoom, dh = h * zoom;
    lg.globalAlpha = is('Swirl') ? 0.22 : 0.8;   // Swirl keeps the trails visible
    lg.drawImage(TINY,
      (w - dw) / 2 + Math.sin(time * 0.035) * w * 0.05,
      (h - dh) / 2 + Math.cos(time * 0.028) * h * 0.05, dw, dh);
    lg.globalAlpha = 1;
  }

  const P = ART.palette.length ? ART.palette : [[120,120,140]];
  lg.globalCompositeOperation = cfg.comp;

  for (const b of blobs) {
    let x = (b.px + Math.sin(b.ph) * b.sx + b.ox) * w;
    let y = (b.py + Math.cos(b.ph * 1.7) * b.sy + b.oy) * h;
    if (is('Swirl')) {                           // orbit the centre
      const dx = x - w / 2, dy = y - h / 2;
      const c = Math.cos(b.orb), s = Math.sin(b.orb);
      x = w / 2 + dx * c - dy * s;
      y = h / 2 + dx * s + dy * c;
    }
    // ~3x radius swing between silence and peak, while the maximum stays
    // small enough that blobs read as separate shapes.
    const rad = b.r * Math.min(w, h) * (0.55 + (b.e * 0.78 + A.beat * 0.30) * cfg.rad);
    if (rad <= 0.5) continue;

    const [r, gg, bb] = P[b.ci % P.length];
    const a = (is('Glitch') ? 0.28 : 0.4) * (0.3 + b.e * cfg.alpha * 1.5);
    const gr = lg.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0,   `rgba(${r},${gg},${bb},${a})`);
    gr.addColorStop(0.55,`rgba(${r},${gg},${bb},${a * 0.42})`);
    gr.addColorStop(1,   `rgba(${r},${gg},${bb},0)`);
    lg.fillStyle = gr;
    lg.beginPath(); lg.arc(x, y, rad, 0, Math.PI * 2); lg.fill();
  }
  lg.globalCompositeOperation = 'source-over';

  if (is('Swirl')) {
    if (PREV.width !== w || PREV.height !== h) { PREV.width = w; PREV.height = h; }
    pg.clearRect(0, 0, w, h);
    pg.drawImage(LO, 0, 0);
  }

  // Upscale — the abstraction step.
  g.drawImage(LO, 0, 0, w, h, 0, 0, W, H);

  if (is('Glitch')) {
    const amt = Math.min(1, A.beat * 0.85 + Math.min(1, A.high * G) * 0.4);
    if (amt > 0.14) {
      const slices = 6, sh = H / slices;
      for (let i = 0; i < slices; i++) {
        if (Math.random() > 0.6) continue;
        const dx = (Math.random() * 2 - 1) * W * 0.17 * amt;
        g.drawImage(LO, 0, i * h / slices, w, h / slices, dx, i * sh, W, sh + 1);
      }
      if (amt > 0.32) {          // two more full-screen passes
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = 0.30 * amt;
        g.drawImage(channel('#ff0000'), 0, 0, w, h, -W * 0.014 * amt, 0, W, H);
        g.drawImage(channel('#00ffff'), 0, 0, w, h,  W * 0.014 * amt, 0, W, H);
        g.globalAlpha = 1;
        g.globalCompositeOperation = 'source-over';
      }
    }
  }

  // Vignette, at full resolution so it stays clean. Cached: only its
  // strength varies, and globalAlpha can carry that without rebuilding the
  // gradient object sixty times a second.
  if (VIGNETTE) {
    g.globalAlpha = Math.max(0, 0.55 - energy * 0.22);
    g.fillStyle = VIGNETTE;
    g.fillRect(0, 0, W, H);
    g.globalAlpha = 1;
  }
}

/* A little grain, rendered once and tiled — upscaled gradients band badly
   on dark screens without it. */
const GRAIN = (() => {
  const s = 128, c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d'), d = x.createImageData(s, s);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 118 + Math.random() * 20;
    d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255;
  }
  x.putImageData(d, 0, 0);
  return c;
})();

let last = performance.now(), videoClock = 0;
// Integrated separately from `time` so the ripple surface can change speed
// without its phase jumping.
let ripplePhase = 0, rippleSwell = 0;
// Dots' shuffle position. Integrated for the same reason the ripple phase is:
// uTime * rate jumps every dot to a new step the instant the rate changes.
let shufflePhase = 0;
// Radius of Poster's layer-two cluster, in cells. Fast to open, slow to
// close, so a hit reads as a burst that fades rather than a level meter.
let clusterR = 0, layer2Clock = 0;
// Fields' outline morph. Integrated so the music can drive the rate without
// jumping every shape to a different silhouette.
let morphPhase = 0;
// Lens' picture-swap clock. Deliberately has no constant term, so the grid is
// perfectly still until there is something to react to.
let lensShuffle = 0;
// Blur's focus depth. Its own envelope rather than the water swell: quicker,
// and driven by the whole mix rather than by bass alone.
let blurFocus = 0;
// How far the cyanotype has developed, 0..1. A state the music moves, not a
// position on a clock: sound is light, so it exposes toward a finished blue
// print and slides back toward the raw violet sheet in the quiet.
let cyanoDev = 0, cyanoSustain = 0;
let videoDirty = false, videoRVFC = false;
let hidden = false;
document.addEventListener('visibilitychange', () => {
  hidden = document.hidden;
  if (!hidden) { last = performance.now(); requestAnimationFrame(frame); }
});

function frame(now) {
  if (hidden) return;                 // resumed by visibilitychange
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; time += dt;
  A.update(dt);

  // A video keeps changing, so its downscaled copy and everything derived
  // from it are refreshed as new frames arrive. Re-deriving the palette costs
  // far more, so that runs a couple of times a second instead — the colours
  // follow the footage without paying for it every frame.
  // Phone video is usually 30fps against a 60Hz display, so half of these
  // frames are the same picture, and redrawing and re-uploading an unchanged
  // one is pure cost. currentTime is no use for detecting this — it advances
  // on ~95% of display frames regardless of whether a new frame was decoded.
  // requestVideoFrameCallback fires exactly once per decoded frame; where it
  // is missing, fall back to doing the work every frame.
  const vFresh = ART.isVideo && ART.img && ART.img.readyState >= 2 &&
                 (videoDirty || !videoRVFC);
  if (vFresh) {
    videoDirty = false;
    updateSource();                       // one bounded draw, everything else reads it
    renderTiny();
    // Re-upload the frame only when a shader look is actually on screen.
    if (LOOKS[look].fx) FX.setSource(SRC, SRC.width, SRC.height);
  }
  // The second layer only ever feeds the shader, so it is refreshed only when
  // a shader look is on screen — and only the looks that read it will use it.
  if (LAYER2.isVideo && LAYER2.img && LAYER2.img.readyState >= 2 &&
      LOOKS[look].fx && (LAYER2.dirty || !LAYER2.rvfc)) {
    LAYER2.dirty = false;
    if (updateSource2()) FX.setSourceB(SRC2, SRC2.width, SRC2.height);
  }
  // Poster's copy of the second picture costs a readback, so it refreshes a
  // couple of times a second rather than per frame — the same trade the
  // palette makes for layer one.
  if (LAYER2.isVideo && LAYER2.img && LAYER2.img.readyState >= 2) {
    layer2Clock += dt;
    if (layer2Clock > 0.45) {
      layer2Clock = 0;
      readStats2();
      if (is('Poster')) { updateSource2(); buildPoster(); }
    }
  }
  if (ART.isVideo && ART.img && ART.img.readyState >= 2) {
    videoClock += dt;
    if (videoClock > 0.7) {
      videoClock = 0;
      try {
        const { palette, dark, lumLo, lumHi, medianNorm } = extractPalette(SRC);
        ART.lumLo = lumLo; ART.lumHi = lumHi; ART.medianNorm = medianNorm;
        ART.raw = palette;
        ART.palette = palette.map(vivify);
        ART.dark = dark;
        buildPoster();
        paintSwatches();
      } catch (e) { /* frame not decodable yet */ }
    }
  }

  updateDrops(dt);
  // The surface rushes forward on a transient and settles between. This is
  // what actually reads as synchronised: measured against the demo tone, with
  // a rate this flat the motion on beats was 1.03x the motion between them,
  // which is to say the water moved at the same speed whether or not anything
  // had happened. The base stays slow, so it is the surge that is visible
  // rather than a fast churn that never stops - frantic came from continuous
  // motion, and sync comes from discrete events.
  // Squared, so the surge concentrates into the hit instead of spreading
  // across the gap. At 120bpm the beat envelope has not returned to zero
  // before the next one arrives, so a linear term lifts the whole interval
  // and reads as everything moving faster rather than as a pulse.
  ripplePhase += dt * (0.20 + resp(A.level) * 0.10 + A.beat * A.beat * 1.55);
  // Roughly a dot every 4s at rest, several a second when it is loud. Each
  // dot is offset within this by its own seed, so they take turns.
  // Weighted hard toward the music: at rest the field is close to still, and
  // a transient moves several dots at once. A large constant term here is
  // what made it read as animation running regardless of the sound.
  // No constant term at all. There are roughly 270 dot cells on screen, each
  // on its own offset, and the fraction that change over any interval is just
  // the phase advance - so even 0.06 turned over a dozen dots a second with
  // nothing playing. Gated above a floor, and the beat term squared so a
  // transient lands as a burst rather than lifting the whole interval.
  shufflePhase += dt * (Math.max(0, resp(A.level) - 0.30) * 0.55 +
                        A.beat * A.beat * 3.20);
  morphPhase += dt * (0.11 + resp(A.level) * 0.81 + A.beat * A.beat * 1.70);
  // Above a floor only, and the beat term is cubed so a weak transient counts
  // for almost nothing while a strong one carries the swap. Below the floor
  // this does not advance at all. Both are needed: with thirty circles on
  // thirty different offsets, the fraction that change over any interval is
  // just the phase advance, so a rate that looks tiny on paper still turns a
  // circle over every second or so across the whole grid.
  lensShuffle += dt * (Math.max(0, resp(A.level) - 0.45) * 0.40 +
                       A.beat * A.beat * A.beat * 1.20);

  const focusTarget = Math.min(1, resp(A.level) * 0.60 + resp(A.bass) * 0.30 +
                                  A.beat * 0.32);
  blurFocus += (focusTarget - blurFocus) *
               (1 - Math.exp(-dt / (focusTarget > blurFocus ? 0.17 : 0.55)));
  const clTarget = Math.max(0, A.beat * 7.0 + resp(A.level) * 2.4 - 1.6);
  clusterR += (clTarget - clusterR) *
              (1 - Math.exp(-dt / (clTarget > clusterR ? 0.10 : 0.70)));

  // Cyanotype's development. The music is the light source, so where the
  // print sits in the process is a function of the song rather than of
  // elapsed time — a chorus can never be the moment it decides to fade.
  //
  // Sustain is a slow memory of how much light has arrived, so a section that
  // stays loud keeps pushing the print further than any single instant of it
  // would; a stab in a quiet passage lifts it and lets go.
  // Deliberately not resp(). That curve saturates hard by design — it is
  // shaped to make quiet music move — and a state that has to span the whole
  // process needs range instead: through resp() a quiet intro already read as
  // half developed and an ordinary verse pinned the print at finished, so it
  // never moved again. The sensitivity setting still applies, damped.
  const light = Math.min(1, Math.pow(A.level * (0.55 + gain() * 0.30), 0.80));
  cyanoSustain += (light - cyanoSustain) * (1 - Math.exp(-dt / 6.0));
  const devTarget = Math.min(1, 0.02 + light * 0.62 + cyanoSustain * 0.45 +
                                A.beat * 0.08);
  // Asymmetric and slow on both sides. Exposure commits faster than the print
  // gives it up, and neither constant is short enough to chase a beat — the
  // position follows the shape of the song, and the beat-scale movement is
  // left to the pulsing of the highlights, which is a separate thing.
  cyanoDev += (devTarget - cyanoDev) *
              (1 - Math.exp(-dt / (devTarget > cyanoDev ? 2.6 : 7.0)));
  // Depth of water. Deliberately not resp(): measured on ordinary music the
  // swell sat pinned between 0.80 and 0.97 — saturated, so the water was
  // always at full depth and every bass transient was a jolt at the top of
  // the range rather than a swell. That is what read as frantic. Its own
  // gentler curve gives the depth somewhere to travel.
  const push = Math.min(1, Math.pow(A.bass * (0.50 + gain() * 0.26), 0.85));
  const swTarget = Math.min(1, push * 0.80 + A.beat * 0.16);
  // Slow on both sides, and much slower than the bands themselves. This term
  // scales the entire displacement field, so when it moves every pixel of the
  // image moves at once — it has to glide, or it reads as a snap however
  // smooth the underlying band is.
  rippleSwell += (swTarget - rippleSwell) *
                 (1 - Math.exp(-dt / (swTarget > rippleSwell ? 0.55 : 1.30)));
  if (LOOKS[look].fx) { drawFX(LOOKS[look]); requestAnimationFrame(frame); return; }
  updateBlobs(dt);
  drawScene(dt);

  // Grain hides banding in the soft looks, but only muddies Poster's flat
  // blocks, which are meant to read as clean colour.
  if (!is('Poster') && GRAIN_SHEET) {
    g.globalCompositeOperation = 'overlay';
    g.globalAlpha = 0.035;
    g.drawImage(GRAIN_SHEET, 0, 0, W, H);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
  }

  requestAnimationFrame(frame);
}

/* =====================================================================
   NOW-PLAYING SEAM
   Recognition is deliberately not wired up — see README for why and what
   each option costs. Anything that can produce a title, artist and image
   URL only has to call setNowPlaying() and the visuals follow.
   ===================================================================== */
async function setNowPlaying({ title, artist, artworkUrl }) {
  const img = await loadImage(artworkUrl, true);   // needs CORS headers
  applyArtwork(img, title, artist);
}
window.setNowPlaying = setNowPlaying;

/* =====================================================================
   UI
   ===================================================================== */
const gate = document.getElementById('gate');
const hud  = document.getElementById('hud');
const errEl = document.getElementById('err');

function paintSwatches() {
  const el = document.getElementById('swatches');
  el.innerHTML = '';
  for (const [r, g2, b] of ART.raw) {
    const i = document.createElement('i');
    i.style.background = `rgb(${r},${g2},${b})`;
    el.appendChild(i);
  }
}

async function begin(kind) {
  errEl.textContent = '';
  try { await A.start(kind); }
  catch (e) {
    const n = e && e.name;
    if (e && e.message === 'NO_AUDIO_TRACK') errEl.textContent = 'No audio came through. Re-open the picker and tick “share audio” before confirming.';
    else if (n === 'NotAllowedError' || n === 'SecurityError') errEl.textContent = 'Permission denied. Allow access and try again.' +
      // Embedded pages are usually denied the microphone by the host
      // frame's permissions policy, and the error is indistinguishable
      // from the user clicking Block.
      (window.self !== window.top ? ' If this page is embedded, open it in its own browser tab. Embedded pages are often blocked from using the microphone.' : '');
    else if (n === 'NotFoundError' || n === 'NotSupportedError' || n === 'TypeError') errEl.textContent = 'This browser can’t capture that source. Try the microphone.';
    else errEl.textContent = 'Couldn’t start audio: ' + (e && e.message ? e.message : 'unknown');
    return;
  }
  gate.classList.add('hidden');
  hud.classList.add('show');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => hud.classList.remove('show'), 5000);
}
document.getElementById('btn-mic').onclick  = () => begin('mic');
document.getElementById('btn-tab').onclick  = () => begin('tab');
document.getElementById('btn-demo').onclick = () => begin('demo');

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS || !navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
  const b = document.getElementById('btn-tab');
  b.disabled = true;
  b.querySelector('.txt span').textContent = 'Desktop only. iOS can’t expose other apps’ audio, so use the microphone.';
}

// --- artwork input: file picker, drag-drop, or a pasted URL -----------
const fileInput = document.getElementById('file');
// Which slot the next picked file lands in. The picker is shared, so this is
// set immediately before opening it and read once the file comes back.
let pickSlot = 1;
document.getElementById('art').onclick = () => { pickSlot = 1; fileInput.click(); };
fileInput.onchange = () => {
  if (fileInput.files[0]) readFile(fileInput.files[0], pickSlot);
  fileInput.value = '';        // so re-picking the same file still fires
};

// Only Cyanotype and Fields read the tone, so the control appears with them
// rather than sitting in the HUD doing nothing on the other seven looks.
const toneEl = document.getElementById('tone');
const TONE_LOOKS = ['Cyanotype', 'Fields'];
function paintTone() {
  toneEl.textContent = 'Tone: ' + toneOf().name;
  toneEl.style.display = TONE_LOOKS.indexOf(LOOKS[look].name) >= 0 ? '' : 'none';
}
toneEl.onclick = () => { tone = (tone + 1) % TONES.length; paintTone(); };

const art2El = document.getElementById('art2');
function paintLayer2Chip() {
  art2El.textContent = LAYER2.img ? 'Image 2 ✕' : 'Image 2';
}
// One control, two states: it loads a second picture, and once there is one
// the same button removes it. A separate clear button would sit in the HUD
// doing nothing most of the time.
art2El.onclick = () => {
  if (LAYER2.img) return clearLayer2();
  pickSlot = 2; fileInput.click();
};
paintLayer2Chip();

function readFile(file, slot = 1) {
  const name = file.name.replace(/\.[^.]+$/, '');

  if (file.type.startsWith('video/')) {
    if (slot === 2) {
      const v2 = document.createElement('video');
      v2.src = URL.createObjectURL(file);
      v2.muted = true; v2.loop = true; v2.playsInline = true; v2.autoplay = true;
      v2.onloadeddata = () => {
        v2.play().catch(() => {});
        applyLayer2(v2, true);
        LAYER2.rvfc = typeof v2.requestVideoFrameCallback === 'function';
        if (LAYER2.rvfc) {
          const tick2 = () => {
            LAYER2.dirty = true;
            if (LAYER2.img === v2) v2.requestVideoFrameCallback(tick2);
          };
          v2.requestVideoFrameCallback(tick2);
        }
      };
      v2.onerror = () => flash('Could not play that video. Try an MP4.');
      return;
    }
    // Object URLs are same-origin, so frames stay readable for palette
    // extraction. muted + playsInline are what let it autoplay on iOS.
    const v = document.createElement('video');
    v.src = URL.createObjectURL(file);
    v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true;
    v.onloadeddata = () => {
      v.play().catch(() => {});
      try { applyArtwork(v, name, '', true); }
      catch (e) { flash('Could not read that video.'); }

      videoRVFC = typeof v.requestVideoFrameCallback === 'function';
      if (videoRVFC) {
        const tick = () => {
          videoDirty = true;
          if (ART.img === v) v.requestVideoFrameCallback(tick);
        };
        v.requestVideoFrameCallback(tick);
      }
    };
    v.onerror = () => flash('Could not play that video. Try an MP4.');
    return;
  }

  const fr = new FileReader();
  // Read to a data URL rather than an object URL: data URLs are same-origin
  // so the canvas stays readable for palette extraction, even from file://.
  fr.onload = async () => {
    try {
      const im = await loadImage(fr.result);
      if (slot === 2) applyLayer2(im, false);
      else applyArtwork(im, name, '');
    } catch (e) { flash('Could not read that image.'); }
  };
  fr.readAsDataURL(file);
}

const dropEl = document.getElementById('drop');
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) dropEl.classList.add('on'); });
addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; dropEl.classList.remove('on');
  const f = e.dataTransfer.files[0];
  if (f && (f.type.startsWith('image/') || f.type.startsWith('video/'))) return readFile(f);
  const url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  if (url) tryUrl(url.trim());
});
addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) return readFile(item.getAsFile());
  const t = e.clipboardData?.getData('text');
  if (t && /^https?:\/\//.test(t.trim())) tryUrl(t.trim());
});

async function tryUrl(url) {
  try {
    applyArtwork(await loadImage(url, true), '', '');
  } catch (e) {
    flash(e.message === 'TAINTED'
      ? 'That image host doesn’t allow cross-origin reads, so its colours can’t be sampled. Save it and drop the file instead.'
      : 'Couldn’t load that image URL.');
  }
}

let flashT;
function flash(msg) {
  const n = document.getElementById('np');
  document.getElementById('np-t').textContent = msg;
  document.getElementById('np-a').textContent = '';
  document.getElementById('np-art').removeAttribute('src');
  n.classList.add('show');
  clearTimeout(flashT);
  flashT = setTimeout(() => n.classList.remove('show'), 5200);
}

document.getElementById('sens').onclick = e => {
  sens = (sens + 1) % SENS.length;
  e.target.textContent = SENS_NAME[sens];
};
const lookMenu = document.getElementById('lookmenu');
function buildLookMenu() {
  lookMenu.innerHTML = '';
  LOOKS.forEach((L, i) => {
    if (L.hidden) return;
    const b = document.createElement('button');
    b.textContent = L.name;
    b.setAttribute('aria-current', String(i === look));
    b.onclick = () => { setLookIndex(i); lookMenu.classList.remove('on'); };
    lookMenu.appendChild(b);
  });
}
function setLookIndex(i) {
  // The recorder is bound to whichever canvas the current style draws to, and
  // the two swap when a 2D style and a shader style trade places.
  if (recording) return;
  look = i;
  const usingFX = !!LOOKS[look].fx;
  document.body.classList.toggle('fx', usingFX);
  if (usingFX) {
    FX.resize(W, H);
    FX.setSource(SRC, SRC.width, SRC.height);
  } else {
    // Clear the 2D canvas so a stale frame from before the shader look
    // cannot flash while the trail-fade looks build back up.
    g.fillStyle = ART.dark; g.fillRect(0, 0, W, H);
  }
  document.getElementById('look').textContent = 'Style: ' + LOOKS[look].name;
  paintTone();
  buildLookMenu();
}
document.getElementById('look').onclick = e => {
  e.stopPropagation();
  buildLookMenu();
  lookMenu.classList.toggle('on');
  if (lookMenu.classList.contains('on')) placeLookMenu(e.currentTarget);
};

// The menu was pinned to the left edge of the page, so on a wrapped HUD it
// could open a long way from the button that produced it. It now sits over
// its own button, clamped to stay on screen. Measured after the menu is
// visible, because a display:none element has no width to clamp against.
function placeLookMenu(btn) {
  const b = btn.getBoundingClientRect();
  const w = lookMenu.offsetWidth;
  const max = innerWidth - w - 12;
  lookMenu.style.left = Math.round(Math.max(12, Math.min(b.left, max))) + 'px';
  lookMenu.style.bottom = Math.round(innerHeight - b.top + 8) + 'px';
}
addEventListener('pointerdown', e => {
  if (!lookMenu.contains(e.target) && e.target.id !== 'look') lookMenu.classList.remove('on');
});
/* =====================================================================
   RECORDING

   Ten seconds of just the animation. The HUD, the style menu and every word
   on the page are DOM nodes rather than canvas pixels, so capturing the
   canvas leaves them out on its own - nothing has to be hidden, and what
   lands in the file is exactly the artwork.

   The stream is bound to one canvas, and the two canvases swap when the look
   changes between a 2D style and a shader one, so switching mid-clip would
   record a canvas nobody is drawing to. The style is held for the duration
   instead.
   ===================================================================== */
const RECORD_SECONDS = 10;
let recording = false;
const recBtn = document.getElementById('rec');

function recorderMime() {
  if (!window.MediaRecorder) return null;
  // mp4 first: iOS records only mp4, and everything else opens it happily.
  const want = ['video/mp4;codecs=avc1.42E01E', 'video/mp4',
                'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  return want.find(t => MediaRecorder.isTypeSupported(t)) || null;
}

async function deliver(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  // Share first where it exists: on a phone a blob download either opens the
  // video in a tab or goes nowhere, while the share sheet can save it to the
  // camera roll.
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

function recordClip() {
  if (recording) return;
  const target = LOOKS[look].fx ? document.getElementById('fxc') : cv;
  const mime = recorderMime();
  if (!target.captureStream || !mime) {
    flash('This browser cannot record the canvas. Try Chrome, Edge or Safari.');
    return;
  }
  let rec;
  try {
    rec = new MediaRecorder(target.captureStream(30),
                            { mimeType: mime, videoBitsPerSecond: 12000000 });
  } catch (e) { flash('Could not start recording here.'); return; }

  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    recording = false;
    clearInterval(tick);
    recBtn.textContent = 'Record 10s';
    const ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type: mime });
    if (!blob.size) { flash('Nothing was captured.'); return; }
    await deliver(blob, `${LOOKS[look].name.toLowerCase()}.${ext}`);
  };

  recording = true;
  rec.start();
  let left = RECORD_SECONDS;
  recBtn.textContent = 'Recording ' + left;
  const tick = setInterval(() => {
    left--;
    if (left > 0) recBtn.textContent = 'Recording ' + left;
  }, 1000);
  setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); },
             RECORD_SECONDS * 1000);
}
recBtn.onclick = recordClip;

/* iPhone Safari implements no Fullscreen API whatsoever — only <video>
   elements can go fullscreen there. iPad and desktop Safari do support it.
   The previous code read
       (el.requestFullscreen || el.webkitRequestFullscreen).call(el)
   which on iPhone is `undefined.call(...)` and threw on every tap, so the
   button was not merely inert, it was broken.

   Where there is no API, the honest alternative is Add to Home Screen: iOS
   launches that in standalone mode with no browser chrome, which is the
   full-screen experience the button is really promising. */
const fullBtn = document.getElementById('full');
const rootEl = document.documentElement;
const fsEnter = rootEl.requestFullscreen || rootEl.webkitRequestFullscreen || null;
const fsExit  = document.exitFullscreen || document.webkitExitFullscreen || null;
const fsActive = () => document.fullscreenElement || document.webkitFullscreenElement;
const standalone = window.navigator.standalone === true ||
                   (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

if (standalone) {
  fullBtn.remove();                       // already running without chrome
} else if (!fsEnter) {
  fullBtn.onclick = () => flash('This browser has no full screen. Tap Share, then Add to Home Screen, and opening it from there runs with no browser bars.');
} else {
  fullBtn.onclick = () => {
    try {
      if (!fsActive()) fsEnter.call(rootEl);
      else if (fsExit) fsExit.call(document);
    } catch (e) { flash('This browser has no full screen. Tap Share, then Add to Home Screen, and opening it from there runs with no browser bars.'); }
  };
}
document.getElementById('restart').onclick = () => {
  A.stop(); hud.classList.remove('show'); gate.classList.remove('hidden');
};

let hideTimer;
function poke() {
  if (gate.classList.contains('hidden')) {
    hud.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => hud.classList.remove('show'), 3200);
  }
}
['pointermove','pointerdown','keydown'].forEach(ev => addEventListener(ev, poke));
addEventListener('keydown', e => {
  if (!gate.classList.contains('hidden')) return;
  if (e.key === ' ') {
    e.preventDefault();
    let n = look;
    do { n = (n + 1) % LOOKS.length; } while (LOOKS[n].hidden && n !== look);
    setLookIndex(n);
  }
  if (e.key.toLowerCase() === 'f') document.getElementById('full').click();
});

// --- boot -------------------------------------------------------------
(async () => {
  // Without WebGL the shader looks cannot render at all, so remove them
  // rather than leaving entries that would show a blank screen.
  if (!FX.init(document.getElementById('fxc'))) {
    for (let i = LOOKS.length - 1; i >= 0; i--) if (LOOKS[i].fx) LOOKS.splice(i, 1);
  }
  resize();
  setLookIndex(look);
  try { applyArtwork(await sampleArtwork()); } catch (e) { /* visuals still run */ }
  requestAnimationFrame(frame);
})();
</script>

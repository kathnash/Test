<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Resonate — sound reactive visuals</title>
<style>
  :root{
    --ui: rgba(255,255,255,.92);
    --dim: rgba(255,255,255,.45);
    --line: rgba(255,255,255,.14);
    --panel: rgba(12,12,16,.72);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; background:#000; overflow:hidden; }
  body{
    font: 400 15px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    color: var(--ui);
    overscroll-behavior:none;
    touch-action: manipulation;
  }
  canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* ---------- start screen ---------- */
  #gate{
    position:fixed; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; padding:32px calc(24px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    background:
      radial-gradient(120% 90% at 50% 12%, #171726 0%, #06060a 55%, #000 100%);
    text-align:center;
    transition: opacity .55s ease, visibility .55s;
  }
  #gate.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .mark{
    width:72px; height:72px; border-radius:50%;
    background: conic-gradient(from 0deg, #6ee7ff, #a78bfa, #fb7185, #fbbf24, #6ee7ff);
    filter: blur(.2px);
    animation: spin 9s linear infinite;
    box-shadow: 0 0 60px rgba(139,124,246,.45);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  h1{ font-size:27px; font-weight:600; letter-spacing:-.02em; margin:0; }
  .sub{ color:var(--dim); max-width:33ch; margin:-14px 0 0; font-size:14.5px; }
  .choices{ display:flex; flex-direction:column; gap:11px; width:min(360px,100%); }
  button.src{
    appearance:none; cursor:pointer; text-align:left;
    display:flex; align-items:center; gap:14px;
    padding:15px 17px; border-radius:15px;
    border:1px solid var(--line); background:rgba(255,255,255,.045);
    color:var(--ui); font:inherit;
    transition: background .18s ease, border-color .18s ease, transform .12s ease;
  }
  button.src:hover{ background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.3); }
  button.src:active{ transform:scale(.985); }
  button.src[disabled]{ opacity:.34; cursor:not-allowed; }
  .ico{ font-size:21px; width:26px; text-align:center; flex:none; }
  .txt b{ display:block; font-weight:550; font-size:15px; }
  .txt span{ display:block; color:var(--dim); font-size:12.5px; line-height:1.42; margin-top:2px; }
  .note{ color:rgba(255,255,255,.3); font-size:12px; max-width:38ch; margin:0; }
  #err{ color:#fda4af; font-size:13px; min-height:1em; max-width:38ch; margin:0; }

  /* ---------- in-experience HUD ---------- */
  #hud{
    position:fixed; z-index:20;
    left:calc(14px + env(safe-area-inset-left));
    right:calc(14px + env(safe-area-inset-right));
    bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    opacity:0; transition:opacity .45s ease; pointer-events:none;
  }
  #hud.show{ opacity:1; pointer-events:auto; }
  .chip{
    appearance:none; cursor:pointer;
    padding:9px 14px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color:var(--ui); font:inherit; font-size:13px;
    transition: background .16s ease;
  }
  .chip:hover{ background:rgba(40,40,52,.85); }
  .chip.on{ background:rgba(255,255,255,.9); color:#0a0a0d; border-color:transparent; }
  .spacer{ flex:1 1 auto; }
  #meter{
    display:flex; align-items:flex-end; gap:3px; height:22px;
    padding:0 4px; opacity:.75;
  }
  #meter i{ width:3px; background:currentColor; border-radius:2px; height:2px; display:block; }
  #silent{
    position:fixed; z-index:21; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; color:var(--dim); font-size:14px; max-width:30ch;
    opacity:0; transition:opacity .6s ease; pointer-events:none;
  }
  #silent.show{ opacity:1; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="gate">
  <div class="mark"></div>
  <h1>Resonate</h1>
  <p class="sub">Turn whatever is playing into light. Pick where the sound should come from.</p>

  <div class="choices">
    <button class="src" id="btn-mic">
      <span class="ico">🎙️</span>
      <span class="txt"><b>Listen through the microphone</b>
      <span>Works everywhere, phone or laptop. Play music out loud on any app or speaker.</span></span>
    </button>
    <button class="src" id="btn-tab">
      <span class="ico">🖥️</span>
      <span class="txt"><b>Capture audio from this device</b>
      <span>Cleanest signal. Desktop Chrome or Edge only — pick a tab or screen and tick “share audio”.</span></span>
    </button>
    <button class="src" id="btn-demo">
      <span class="ico">✳️</span>
      <span class="txt"><b>Run the built-in demo tone</b>
      <span>No permissions needed. Just to see the visuals move.</span></span>
    </button>
  </div>

  <p id="err"></p>
  <p class="note">Audio is analysed on-device and never leaves this page or gets recorded.</p>
</div>

<div id="silent">No sound detected yet — turn the volume up, or move closer to the speaker.</div>

<div id="hud">
  <button class="chip" id="mode">Bloom</button>
  <button class="chip" id="palette">Spectrum</button>
  <button class="chip" id="full">Fullscreen</button>
  <span class="spacer"></span>
  <span id="meter"></span>
  <button class="chip" id="restart">Change source</button>
</div>

<script src="audio.js"></script>
<script>
"use strict";

/* =====================================================================
   1. CANVAS + PALETTES
   ===================================================================== */
const cv = document.getElementById('c');
const g = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));
resize();

const PALETTES = [
  { name:'Spectrum', hue: t => (t * 60 + A.centroid * 250) % 360, sat: 88, lit: 60 },
  { name:'Ember',    hue: t => 12 + t * 48 + A.centroid * 26,     sat: 92, lit: 57 },
  { name:'Ice',      hue: t => 178 + t * 70 - A.centroid * 34,    sat: 84, lit: 62 },
  { name:'Mono',     hue: () => 0,                                sat: 0,  lit: 82 }
];
let pal = 0;
const col = (t, l = 1, a = 1) => {
  const p = PALETTES[pal];
  return `hsla(${p.hue(t)}, ${p.sat}%, ${Math.min(94, p.lit * l)}%, ${a})`;
};

/* =====================================================================
   2. VISUAL MODES
   ===================================================================== */
let time = 0;

/* --- Bloom: radial spectrum with beat-driven shockwave rings --------- */
const BARS = 128;
const smoothBars = new Float32Array(BARS);
let rings = [];

function drawBloom(dt) {
  const cx = W / 2, cy = H / 2;
  const base = Math.min(W, H) * 0.17;
  const R = base * (1 + A.bass * 0.42 + A.beat * 0.14);

  if (A.beatFlash > 0.92) rings.push({ r: R, a: 0.55, w: 2.5 + A.bass * 4 });
  rings = rings.filter(ring => {
    ring.r += (Math.min(W, H) * 0.55) * dt;
    ring.a -= dt * 0.55;
    if (ring.a <= 0) return false;
    g.beginPath(); g.arc(cx, cy, ring.r, 0, Math.PI * 2);
    g.strokeStyle = col(0.5, 1.25, ring.a);
    g.lineWidth = ring.w * ring.a;
    g.stroke();
    return true;
  });

  // Log-spaced sampling so bass doesn't hog the majority of the bins.
  const nBins = A.freq ? A.freq.length : 1024;
  g.lineCap = 'round';
  for (let i = 0; i < BARS; i++) {
    const t = i / BARS;
    const idx = Math.floor(Math.pow(t, 1.9) * nBins * 0.62);
    const target = A.freq ? A.freq[idx] / 255 : 0;
    smoothBars[i] += (target - smoothBars[i]) * (target > smoothBars[i] ? 0.55 : 0.12);

    const len = smoothBars[i] * Math.min(W, H) * 0.30 + 2;
    const ang = t * Math.PI * 2 - Math.PI / 2 + time * 0.06;
    const x1 = cx + Math.cos(ang) * R, y1 = cy + Math.sin(ang) * R;
    const x2 = cx + Math.cos(ang) * (R + len), y2 = cy + Math.sin(ang) * (R + len);

    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2);
    g.strokeStyle = col(t, 1 + smoothBars[i] * 0.5, 0.34 + smoothBars[i] * 0.66);
    g.lineWidth = Math.max(1.5, (Math.min(W, H) / 340) * (1 + smoothBars[i]));
    g.stroke();
  }

  // Core
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, R * 1.05);
  gr.addColorStop(0, col(0.12, 1.3, 0.34 + A.level * 0.42));
  gr.addColorStop(0.7, col(0.4, 1.0, 0.10 + A.bass * 0.2));
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.beginPath(); g.arc(cx, cy, R * 1.05, 0, Math.PI * 2);
  g.fillStyle = gr; g.fill();
}

/* --- Particles: orbiting field kicked outward by every beat ---------- */
const P = [];
function seedParticles() {
  P.length = 0;
  const n = Math.round(Math.min(460, (W * H) / 3400));
  for (let i = 0; i < n; i++) {
    P.push({
      a: Math.random() * Math.PI * 2,
      r: Math.random() * Math.min(W, H) * 0.46 + 22,
      s: 0.10 + Math.random() * 0.42,
      v: 0,
      z: 0.35 + Math.random() * 0.9,
      t: Math.random(),
      // Each particle keeps its own resting radius, so the field fills a
      // disc. Without this every particle chases one shared radius and
      // the whole thing collapses into a single ring.
      home: Math.sqrt(Math.random())
    });
  }
}
function drawParticles(dt) {
  if (!P.length) seedParticles();
  const cx = W / 2, cy = H / 2;
  const maxR = Math.min(W, H) * 0.52;

  for (const p of P) {
    if (A.beatFlash > 0.92) p.v += (52 + A.bass * 175) * p.z;
    p.v *= 0.935;
    p.r += p.v * dt * 8;
    const rest = maxR * (0.10 + p.home * 0.88) * (0.55 + A.level * 0.55);
    p.r += (rest - p.r) * dt * 1.6;
    if (p.r < 12) p.r = 12;
    p.a += p.s * dt * (0.32 + A.mid * 1.5);

    const x = cx + Math.cos(p.a) * p.r;
    const y = cy + Math.sin(p.a) * p.r * 0.9;
    const size = (0.9 + p.z * 2.3) * (1 + A.high * 1.5 + A.beat * 0.55);

    g.beginPath(); g.arc(x, y, size, 0, Math.PI * 2);
    // Additive blending drives overlapping dots toward white, so keep the
    // per-dot alpha low enough that hue still reads in dense areas.
    g.fillStyle = col(p.t, 1.05, 0.16 + A.level * 0.4);
    g.fill();

    // motion streak while travelling fast
    if (p.v > 6) {
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(cx + Math.cos(p.a) * (p.r - p.v * 0.35), cy + Math.sin(p.a) * (p.r - p.v * 0.35) * 0.9);
      g.strokeStyle = col(p.t, 1.1, 0.16);
      g.lineWidth = size * 0.7; g.stroke();
    }
  }
}

/* --- Ribbon: stacked waveform aurora --------------------------------- */
function drawRibbon(dt) {
  if (!A.wave) return;
  const layers = 5;
  const mid = H / 2;
  for (let L = 0; L < layers; L++) {
    const t = L / layers;
    const amp = (H * 0.16) * (1 - t * 0.55) * (0.35 + A.level * 1.5);
    const off = Math.sin(time * (0.35 + t * 0.5)) * H * 0.07 * (1 + A.bass);
    g.beginPath();
    const N = A.wave.length;
    const stepX = W / 160;
    for (let i = 0; i <= 160; i++) {
      const v = (A.wave[Math.floor(i / 160 * (N - 1))] - 128) / 128;
      const x = i * stepX;
      const y = mid + off + v * amp + Math.sin(i * 0.09 + time * 1.4 + L) * 9 * (0.3 + A.mid);
      i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.strokeStyle = col(t, 1.15, 0.5 - t * 0.3);
    g.lineWidth = (2.6 + A.bass * 7) * (1 - t * 0.5);
    g.stroke();
  }
}

const MODES = [
  { name: 'Bloom',     fn: drawBloom,     fade: 0.20 },
  { name: 'Particles', fn: drawParticles, fade: 0.20 },
  { name: 'Ribbon',    fn: drawRibbon,    fade: 0.10 }
];
let mode = 0;

/* =====================================================================
   3. RENDER LOOP
   ===================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; time += dt;
  A.update(dt);

  // Trail fade instead of a hard clear — this is what produces the glow.
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = `rgba(0,0,0,${MODES[mode].fade})`;
  g.fillRect(0, 0, W, H);

  g.globalCompositeOperation = 'lighter';
  MODES[mode].fn(dt);

  // Bloom on strong transients. A flat full-screen additive fill settles
  // into a permanent colour haze (additions outrun the trail fade), so
  // this falls off to transparent at the edges and stays low-alpha.
  if (A.beatFlash > 0.02) {
    const bg = g.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.62);
    bg.addColorStop(0, col(0.3, 1.4, A.beatFlash * 0.05));
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);
  }
  g.globalCompositeOperation = 'source-over';

  paintMeter();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* =====================================================================
   4. UI
   ===================================================================== */
const gate  = document.getElementById('gate');
const hud   = document.getElementById('hud');
const errEl = document.getElementById('err');
const silentEl = document.getElementById('silent');

const meterBars = [];
(function buildMeter(){
  const m = document.getElementById('meter');
  for (let i = 0; i < 14; i++) { const b = document.createElement('i'); m.appendChild(b); meterBars.push(b); }
})();
function paintMeter() {
  if (!A.ready || !A.freq) return;
  const n = meterBars.length;
  for (let i = 0; i < n; i++) {
    const idx = Math.floor(Math.pow(i / n, 1.8) * A.freq.length * 0.55);
    meterBars[i].style.height = (2 + (A.freq[idx] / 255) * 20) + 'px';
  }
  silentEl.classList.toggle('show', A.silentFor > 3.5);
}

async function begin(kind) {
  errEl.textContent = '';
  try {
    await A.start(kind);
  } catch (e) {
    const n = e && e.name;
    if (e && e.message === 'NO_AUDIO_TRACK') {
      errEl.textContent = 'No audio came through. Re-open the picker and tick the “Share tab audio” / “Share system audio” checkbox before confirming.';
    } else if (n === 'NotAllowedError' || n === 'SecurityError') {
      errEl.textContent = 'Permission denied. Allow access, then try again.';
    } else if (n === 'NotFoundError' || n === 'NotSupportedError' || n === 'TypeError') {
      errEl.textContent = 'This browser can’t capture that source. Try the microphone option instead.';
    } else {
      errEl.textContent = 'Couldn’t start audio: ' + (e && e.message ? e.message : 'unknown error');
    }
    return;
  }
  seedParticles();
  gate.classList.add('hidden');
  hud.classList.add('show');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => hud.classList.remove('show'), 5000);
}

document.getElementById('btn-mic').onclick  = () => begin('mic');
document.getElementById('btn-tab').onclick  = () => begin('tab');
document.getElementById('btn-demo').onclick = () => begin('demo');

// getDisplayMedia exists on iOS Safari but never yields audio — steer to mic.
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS || !navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
  const b = document.getElementById('btn-tab');
  b.disabled = true;
  b.querySelector('.txt span').textContent =
    'Not available on this device — iOS and Safari don’t expose other apps’ audio. Use the microphone instead.';
}

document.getElementById('mode').onclick = e => {
  mode = (mode + 1) % MODES.length;
  e.target.textContent = MODES[mode].name;
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
};
document.getElementById('palette').onclick = e => {
  pal = (pal + 1) % PALETTES.length;
  e.target.textContent = PALETTES[pal].name;
};
document.getElementById('full').onclick = () => {
  if (!document.fullscreenElement) (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
  else document.exitFullscreen();
};
document.getElementById('restart').onclick = () => {
  A.stop();
  hud.classList.remove('show');
  gate.classList.remove('hidden');
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
};

// HUD auto-hides so the visuals can stand alone; any input brings it back.
let hideTimer;
function poke() {
  if (gate.classList.contains('hidden')) {
    hud.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => hud.classList.remove('show'), 3200);
  }
}
['pointermove','pointerdown','keydown'].forEach(ev => addEventListener(ev, poke));

addEventListener('keydown', e => {
  if (!gate.classList.contains('hidden')) return;
  if (e.key === ' ') { e.preventDefault(); document.getElementById('mode').click(); }
  if (e.key.toLowerCase() === 'c') document.getElementById('palette').click();
  if (e.key.toLowerCase() === 'f') document.getElementById('full').click();
});
</script>
</body>
</html>
